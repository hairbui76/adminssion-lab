[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/hairbui76/admission-lab"

[workspace.dependencies]
# `admissionlab-diff`'s `admission.rs` (Task 4.4) is the first
# cross-crate consumer of this crate: `diff_admission_decision` takes
# `&admissionlab_admission::AdmissionOutcome` (the roadmap's own frozen
# signature) and reads its `AdmissionDecision`. This is a `diff ->
# admission` edge. §1.1's layering line reads "diff ->
# normalize/core domain types", but the frozen 4.4 signature is stated
# in terms of an `admissionlab-admission` type, so that edge is real and
# intended rather than an oversight -- resolved deliberately, the same
# way `admissionlab-admission`'s own `Cargo.toml` documents its
# `admission -> fixtures` edge. It is acyclic: `admissionlab-admission`
# depends on `admissionlab-fixtures` and `admissionlab-core`, neither of
# which depends on `admissionlab-diff`, and nothing may ever add an
# `admission -> diff` edge back.
admissionlab-admission = { path = "crates/admissionlab-admission" }
admissionlab-cluster = { path = "crates/admissionlab-cluster" }
admissionlab-core = { path = "crates/admissionlab-core" }
# A workspace entry solely so `admissionlab-gateway` can name it as a
# **dev-dependency** (Task 6.8): `tests/probe.rs` runs the real echo
# backend on an ephemeral local port and probes it, rather than
# hand-writing a stand-in for the frozen JSON contract that crate owns.
# There is no production `gateway -> echo` edge, and there must not be:
# `admissionlab-echo` is a deployed workload, not engine code, and the
# probe parses its wire contract without importing its Rust types (see
# `admissionlab_gateway::probe`'s own documentation for why).
admissionlab-echo = { path = "crates/admissionlab-echo" }
# `admissionlab-policy`'s `severity.rs`/`evaluate.rs` (Task 4.8) are the
# first cross-crate consumers of this crate: policy grades
# `admissionlab_diff::SemanticChange` values and keys its default
# severity table on `SemanticChangeKind`. This is the `policy -> diff`
# edge §1.1 draws explicitly, so it needs no separate justification --
# only a workspace-level entry, which it did not have before because
# nothing depended on `admissionlab-diff` yet.
admissionlab-diff = { path = "crates/admissionlab-diff" }
# `admissionlab-admission`'s `execute.rs` (Task 3.4) is the first
# cross-crate consumer of this crate: `AdmissionExecutor::execute_create`
# takes `&admissionlab_fixtures::FixtureSource` and
# `&admissionlab_fixtures::resources::ResolvedResource` and calls
# `admissionlab_fixtures::execute::dry_run_create` to do the actual
# server-side dry-run CREATE. This is the `admission -> fixtures` edge
# Controller supplement §2 (Task 3.4) names: combined with the existing
# `fixtures -> core` edge, that gives `admission -> fixtures -> core`,
# which is fine (no cycle) -- what must never happen is `core ->
# admission`, which `admissionlab-core/src/run.rs`'s own module
# documentation already covers.
admissionlab-fixtures = { path = "crates/admissionlab-fixtures" }
# `admissionlab-recipes`' `tests/istio_gateway_recipe.rs` (Task 6.10) is
# the first cross-crate consumer of this crate: the certified Istio
# Gateway API recipe's own integration test drives the real apply/
# reconcile/endpoint/port-forward/probe pipeline against a live cluster.
# A *dev*-dependency edge only (`recipes -> gateway` exists in no
# shipped code), and acyclic: `admissionlab-gateway` depends on `spec`,
# `core`, `diff`, `fixtures` and `admission`, none of which reaches back
# to `admissionlab-recipes`.
admissionlab-gateway = { path = "crates/admissionlab-gateway" }
# `admissionlab-test-webhook`'s `tests/kind_smoke.rs` (Task 2.7) is the
# first cross-crate consumer of this crate — drives a resolved recipe's
# component through the real Task 2.6 install-and-wait pipeline.
admissionlab-installer = { path = "crates/admissionlab-installer" }
# `admissionlab-diff`'s `workload.rs`/`trace.rs` (Tasks 4.5/4.6) are the
# first cross-crate consumers of this crate: `diff_workload_objects` and
# `diff_admission_trace` take `&NormalizedObject` and `&NormalizedTrace`
# on both sides -- the roadmap's own frozen signatures. This is the
# `diff -> normalize` edge §1.1 draws explicitly, so it needs no
# separate justification, only a workspace-level entry (nothing depended
# on `admissionlab-normalize` before). Acyclic: `admissionlab-normalize`
# depends on `admissionlab-admission`, `json-patch`, and `serde`, none of
# which reach back to `admissionlab-diff`, and a `normalize -> diff` edge
# must never be added.
admissionlab-normalize = { path = "crates/admissionlab-normalize" }
# `admissionlab-report`'s `model.rs` (Task 4.10) is the first cross-crate
# consumer of this crate: §1.2's cross-task type registry freezes
# `LabResult::policy` as an `admissionlab_policy::PolicyResult`, and the
# report's five-bucket fixture count reads each `ClassifiedChange`'s
# already-decided `severity`/`expected`. This is the `report -> policy`
# edge §1.1 draws explicitly, so it needs no separate justification --
# only a workspace-level entry, which it did not have before because
# nothing depended on `admissionlab-policy` yet. Acyclic, and the one
# direction that matters: `report` reads grades, it never produces them
# (§1.1's "do not let report rendering decide severity"), and nothing may
# ever add a `policy -> report` edge back.
admissionlab-policy = { path = "crates/admissionlab-policy" }
# `admissionlab-test-webhook`'s `tests/recipe_loads.rs` and
# `tests/kind_smoke.rs` (Task 2.7) are the first cross-crate consumers of
# this crate — loading `recipes/test-webhook/recipe.yaml` through Task
# 2.5's own public loader.
admissionlab-recipes = { path = "crates/admissionlab-recipes" }
# `admissionlab-cli`'s `pipeline` module (Task 4.14) is the first
# cross-crate consumer of this crate: it builds the `LabResult` every
# renderer reads, redacts it once, and writes the terminal/JSON/HTML
# artifacts. This is the last edge in §1.1's chain (`cli -> report ->
# policy -> diff -> ...`), and it can never be part of a cycle: nothing
# in this workspace depends on `admissionlab-cli`, which is exactly why
# the compare-and-report half of the pipeline is assembled there rather
# than in `admissionlab-core` -- see `admissionlab_core::run`'s own
# module documentation for that argument in full.
admissionlab-report = { path = "crates/admissionlab-report" }
admissionlab-spec = { path = "crates/admissionlab-spec" }
assert_cmd = "2.2.2"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
globset = "0.4.20"
# `admissionlab-test-webhook`'s `serve` mode (Task 2.7) is a minimal
# hand-rolled HTTPS server for `/healthz` — no `axum`/`tower` framework
# for a single static route. `bytes`/`http-body-util`/`hyper`/`hyper-util`
# are all *already* resolved in `Cargo.lock`, transitively, via `kube`'s
# own `rustls-tls` HTTP client stack — pinning these to the exact versions
# `kube` already pulls in (verified against `Cargo.lock` before adding:
# `bytes` 1.12.1; `http-body-util` 0.1.5; `hyper` 1.11.1; `hyper-util`
# 0.1.20) adds no new crate to the dependency graph, only promotes
# already-fetched transitive dependencies to direct ones. No separate
# `http` entry: `hyper` itself re-exports every `http::` type this crate
# needs (`Request`/`Response`/`StatusCode`/`Method`; confirmed by reading
# `hyper-1.11.1/src/lib.rs`'s own `pub use http::{...}` line), so naming
# `http` directly would be a redundant second name for the same crate.
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
# `tokio`: the async runtime `TokioIo` adapts hyper's IO traits onto.
hyper-util = { version = "0.1.20", features = ["tokio"] }
# `admissionlab-admission`'s `WebhookInvocation::patch` (Task 3.3) stores
# the observed mutation as RFC 6902 JSON Patch operations
# (`json_patch::PatchOperation`), not a raw `serde_json::Value` diff, so
# a later task (4.6's diff comparison) can inspect individual patch
# operations rather than re-parsing an opaque JSON blob. The crate's
# registry name uses a hyphen (`json-patch`); the library Rust code
# `use`s is `json_patch` (its own `Cargo.toml` sets `[lib] name =
# "json_patch"`). License `MIT/Apache-2.0`, already on this workspace's
# `deny.toml` allow-list -- no new exception needed. `PatchOperation`
# itself derives `Serialize`/`Deserialize`/`Clone`/`PartialEq`/`Eq`
# (verified by reading `json-patch-4.2.0/src/lib.rs` directly), which is
# exactly what this field's own model tests round-trip.
json-patch = "4.2.0"
# `admissionlab-admission`'s `audit_reader.rs` (Task 3.5) parses each
# audit event's `requestReceivedTimestamp`/`stageTimestamp` (RFC 3339,
# microsecond precision) into a real instant rather than keeping the raw
# string, because Task 3.7 compares those against the
# `std::time::SystemTime` request window `RawAdmissionResponse` already
# records -- and `jiff::Timestamp` converts to `SystemTime` infallibly
# via `From` (verified by reading `jiff-0.2.35/src/timestamp.rs`'s own
# `impl From<Timestamp> for std::time::SystemTime`, which is gated on
# jiff's `std` feature).
#
# **Not `chrono`**: `chrono` is not in this workspace's dependency graph
# at all (`grep chrono Cargo.lock` finds nothing), so adding it would be
# a genuinely new dependency. `jiff` *is* already resolved at exactly
# this version, because `k8s-openapi` 0.28 depends on it directly (its
# own manifest: `jiff = { version = "0.2", default-features = false,
# features = ["alloc", "serde"] }`) and uses it for the generated
# `Time`/`MicroTime` Kubernetes timestamp types -- so this entry is a
# promotion of an already-fetched transitive dependency to a direct one,
# and it parses Kubernetes timestamps with the same library the
# Kubernetes API types in this graph already use.
#
# `default-features = false` is load-bearing: jiff's *default* feature
# set is `["std", "tz-system", "tz-fat", "tzdb-bundle-platform",
# "tzdb-zoneinfo", "tzdb-concatenated", "perf-inline"]`, and the `tzdb-*`
# ones pull in `jiff-tzdb-platform`/`jiff-tzdb` -- a bundled IANA time
# zone database this project has no use for, since audit timestamps are
# always UTC instants and are never rendered in a local time zone. The
# two features requested here are exactly `k8s-openapi`'s own set plus
# `std`: `serde` for `Timestamp`'s `Serialize`/`Deserialize` (how audit
# events are parsed and how Task 3.10 writes `audit.json`), and `std`
# for the `SystemTime` conversion above. `std` enables only
# `jiff-core/std`, `serde_core/std`, and `log?/std` -- all already-
# resolved crates, so no new package enters `Cargo.lock`.
jiff = { version = "0.2.35", default-features = false, features = [
    "serde",
    "std",
] }
# `admissionlab-installer`'s readiness probes (Task 2.4) read `Deployment`/
# `DaemonSet`/`Job`/webhook-configuration objects through `k8s-openapi`'s
# generated types. `k8s-openapi` requires *exactly one* `v1_*` Kubernetes
# version feature to be enabled across the whole compiled graph -- zero
# panics its own build script (`build.rs`), two also panics it -- and its
# own documented convention is "library crates must not enable a version
# feature; leave that to the final binary crate" (verified against
# `k8s-openapi-0.28.0/build.rs`'s panic text). That convention assumes a
# final binary already depends (transitively) on the library that needs
# it; nothing in this workspace depends on `admissionlab-installer` yet
# (`admissionlab-cli` does not -- confirmed via `cargo metadata --no-deps`),
# so there is no binary crate to anchor the choice on. Verified empirically
# (not assumed): putting `k8s-openapi` in `admissionlab-installer`'s own
# `[dependencies]` with no feature, and only a `[dev-dependencies]` entry
# enabling `v1_36`, makes that crate's own `cargo test` pass but makes a
# plain `cargo build --workspace` fail outright (zero `v1_*` features reach
# the non-dev dependency graph at all, since nothing else in the workspace
# requests one either) -- see Task 2.4's report for the exact failure.
# Pinning the version *and* feature once, here, and having every crate
# that needs `k8s-openapi` inherit it via `{ workspace = true }` (as
# `admissionlab-installer` now does) sidesteps that gap: it is a single,
# workspace-wide source of truth a later crate can adopt without risking
# ever picking a *different* feature and re-triggering the "two features
# enabled" panic -- the actual failure mode the "library must not enable"
# convention exists to prevent. Bump this (and re-verify `cargo build
# --workspace`) deliberately, not incidentally, if a future task needs a
# newer Kubernetes version's generated types.
k8s-openapi = { version = "0.28.0", features = ["v1_36"] }
# `admissionlab-installer`'s readiness probes (Task 2.4) talk to each
# cluster's own kube-apiserver directly via its isolated kubeconfig (never
# the operator's ambient `~/.kube/config` -- see `readiness.rs`'s
# `client_for`, which mirrors `manifests.rs`'s `kubectl_command` chokepoint
# discipline). Default features (`client`, `rustls-tls`, `ring`) are kept:
# this project already requires a working C toolchain to build (`ring`
# compiles C via `cc-rs`, which is exactly why `CC=/usr/bin/cc` is
# load-bearing on this machine -- see `research-kube-api.md` §7), so there
# is no simpler TLS backend to fall back to, and every `kubectl`/`helm`
# TLS connection this project already makes needs a real CA-verified HTTPS
# client regardless. No `runtime` feature: Task 2.4 hand-rolls a capped
# poll loop rather than using `kube_runtime::wait::await_condition` (see
# that task's report for why), so `kube_runtime` is never pulled in.
kube = { version = "4.2.0" }
# Safe, non-`unsafe` access to POSIX `statvfs` (`admissionlab-core`'s
# doctor disk-space check) and to `killpg` (`process.rs`'s process-group
# termination, Task 9.4 -- this workspace forbids `unsafe_code`, so
# signalling a process group has to go through a crate that already
# encapsulates the `libc` call safely rather than through a local
# `unsafe` block or a `pre_exec` hook). Unix-only crate: every consumer
# pulls it in through a `[target.'cfg(unix)'.dependencies]` table rather
# than an unconditional one, so it is never even fetched for a non-Unix
# target.
nix = { version = "0.31.3", default-features = false, features = [
    "fs",
    "signal",
] }
predicates = "3.1.4"
# `admissionlab-test-webhook`'s `bootstrap` mode (Task 2.7) generates a
# deterministic, test-only, per-cluster CA and a CA-signed serving cert
# for its own HTTPS listener entirely in-process — no shelling out to a
# system `openssl` binary (which the image would then need to bundle) and
# no private key ever touching disk outside the pod's own ephemeral,
# memory-backed `emptyDir`. `rcgen` is the standard pure-Rust X.509
# generation crate (no `unsafe` of its own; this workspace forbids it in
# every crate regardless). Default features (`crypto`, `pem`, `ring`) are
# kept: `ring` is the same crypto backend `kube`'s own `rustls-tls`
# feature already selects (see that entry's comment below), so this adds
# no *second* crypto backend to the graph.
rcgen = "0.14.10"
# The `ring`-backed TLS stack `admissionlab-test-webhook`'s `serve` mode
# (Task 2.7) builds its own `rustls::ServerConfig` from directly (never
# through the process-global default-provider install `kube`'s client may
# also touch — see that crate's own module documentation for why this
# never races: `bootstrap` and `serve` are always two separate container
# processes, never both live in the same process). Pinned to the exact
# version `kube`'s `rustls-tls` feature already resolves in `Cargo.lock`
# (0.23.43), so this is a promotion of an already-fetched transitive
# dependency to a direct one, not a new one. `default-features = false`
# is load-bearing, not cosmetic: rustls 0.23's *default* feature set
# pulls in `aws_lc_rs` (a second, unneeded crypto backend/C dependency)
# alongside whatever is explicitly requested — confirmed empirically,
# not assumed, after a first pass here without `default-features = false`
# actually compiled `aws-lc-rs`/`aws-lc-sys` into the graph even though
# only `ring` was named. Explicit `ring`/`std`/`tls12` matches exactly
# what `kube`'s own `rustls-tls` feature already selects, so the whole
# workspace still builds exactly one crypto backend. `ring` feature:
# gives access to `rustls::crypto::ring::default_provider()`.
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
# Parses the PEM certificate/key `rcgen` writes to the shared `emptyDir`
# back into `rustls`'s own `CertificateDer`/`PrivateKeyDer` types, via
# the `PemObject` trait (`CertificateDer::pem_file_iter`/
# `PrivateKeyDer::from_pem_file`). Already resolved transitively at this
# exact version via `rustls` itself (a promotion, not a new dependency).
# **Not** `rustls-pemfile`, which this crate used in an earlier pass:
# `cargo deny check` flagged it as unmaintained (RUSTSEC-2025-0134,
# archived upstream August 2025) the moment it was added, and that
# advisory's own text names this exact replacement ("depend directly on
# the underlying PEM parsing code included in rustls-pki-types since
# 1.9.0 ... via the `PemObject` trait") — this is that migration, not a
# speculative choice. `std` feature: `default-features` alone only pulls
# in `alloc` (`pem_file_iter`/`from_pem_file` need real file I/O).
rustls-pki-types = { version = "1.15.1", features = ["std"] }
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
# `admissionlab-installer`'s raw-manifest backend (Task 2.3) hashes each
# manifest file's canonical source bytes into `ManifestBundle::source_hash`
# (SHA-256, lowercase hex) for run-manifest provenance (PRODUCT.md §28) --
# the same convention Task 3.1 uses for fixtures. Pinned to the 0.10 line
# (not the newer 0.11) because its dependency chain resolves to
# `generic-array 0.14`, which implements `LowerHex` for a digest's output
# directly, so `format!("{:x}", hasher.finalize())` needs no extra hex-
# encoding crate.
sha2 = "0.10.9"
# `serde_yaml` is deprecated (its only remaining release is
# 0.9.34+deprecated, archived upstream). `serde_norway` is a maintained
# fork that continues the same 0.9 version lineage and API, so it is a
# drop-in replacement rather than an architecture change (roadmap decision,
# see admissionlab-spec).
serde_norway = "0.9.42"
thiserror = "2.0.20"
tokio = "1.53.1"
# `admissionlab-test-webhook`'s `serve` mode (Task 2.7) terminates TLS on
# its own accepted `TcpStream`s directly (no reverse proxy). Pinned to the
# exact version `kube`'s own client stack already resolves in
# `Cargo.lock` (0.26.4) -- a promotion, not a new dependency.
# `default-features = false` for the same reason as the `rustls` entry
# above: `tokio-rustls`'s own `default` feature list is `["logging",
# "tls12", "aws_lc_rs"]` (verified by reading its `Cargo.toml` directly,
# not assumed from `cargo add`'s dry-run summary, which — confirmed
# empirically — renders this particular alias pair misleadingly) --
# left alone, that default silently re-introduces the second crypto
# backend `rustls`'s own `default-features = false` above was written to
# avoid. `ring` is deliberately not requested here: it only forwards to
# `rustls/ring`, which this workspace's `rustls` entry already enables
# directly.
tokio-rustls = { version = "0.26.4", default-features = false, features = [
    "logging",
    "tls12",
] }
# `admissionlab-test-webhook`'s `bootstrap` mode (Task 2.7) computes the
# generated CA/serving certificate's validity window
# (`OffsetDateTime::now_utc()` plus/minus a fixed `Duration`).
# `CertificateParams::not_before`/`not_after` are this crate's own
# `OffsetDateTime`, which `rcgen` does not re-export, so this is a direct
# dependency rather than reaching through `rcgen::`. Already resolved
# transitively at 0.3.55 via `rcgen` itself -- a promotion, not a new
# dependency.
time = "0.3.55"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.26.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
