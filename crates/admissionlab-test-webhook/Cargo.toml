[package]
name = "admissionlab-test-webhook"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# A library as well as a binary since Task 3.9 — see `src/lib.rs`'s own
# module documentation for why (`tests/behavior.rs` has to reach the
# route constants and the request handler; `src/main.rs` is a thin
# `clap` front end over this library).
[lib]
name = "admissionlab_test_webhook"
path = "src/lib.rs"

[[bin]]
name = "admissionlab-test-webhook"
path = "src/main.rs"

[dependencies]
# Two subcommands (`bootstrap`, `serve`) — see `src/main.rs`. Already a
# workspace dependency (`admissionlab-cli`); `derive` is already enabled
# at the workspace level.
clap = { workspace = true }
# `bootstrap` mode's Kubernetes API access: fetching and replacing the
# `ValidatingWebhookConfiguration` this recipe installs, so its
# `caBundle` reflects the CA generated for *this* cluster (see
# `src/bootstrap.rs`'s module documentation). Default features
# (`client`, `rustls-tls`, `ring`) already cover in-cluster config
# discovery (`Client::try_default`) — no `derive`/`runtime` feature
# needed, mirroring `admissionlab-installer`'s own reasoning for this
# same dependency.
kube = { workspace = true }
k8s-openapi = { workspace = true }
# `bootstrap` mode's CA and serving-certificate generation (see this
# crate's own root-level `Cargo.toml` comment for why `rcgen` over
# shelling out to `openssl`). `time` computes the generated certificates'
# validity window (`rcgen` does not re-export it).
rcgen = { workspace = true }
time = { workspace = true }
# `serve` mode's minimal hand-rolled HTTPS server for `/healthz` — see
# the root `Cargo.toml`'s comments on each of these for why none of them
# is a new dependency to the workspace's resolved graph.
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
tokio-rustls = { workspace = true }
# Task 3.9's admission-review handling: `serde` derives the four
# hand-written wire structs in `src/serve.rs` (see that module's own
# documentation for why they are hand-written rather than taken from
# `kube::core::admission`), and `serde_json` both parses the incoming
# object and builds the RFC 6902 patch operations `src/mutate.rs`
# emits. Both were already workspace dependencies and already in
# `Cargo.lock` -- `serde_json` was already a dev-dependency of this very
# crate -- so neither adds a crate to the resolved graph. The base64
# encoding `AdmissionResponse.patch` needs on the wire comes from
# `k8s-openapi`'s own `ByteString` (already a dependency, above), not
# from a new `base64` entry.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
# `tests/recipe_loads.rs` loads `recipes/test-webhook/recipe.yaml`
# through Task 2.5's own public loader (`load_recipe_overrides`) and
# proves it resolves into a `Recipe` with the exact fields this task
# declares — a real regression test, not just "the file exists".
admissionlab-recipes = { workspace = true }
# `tests/recipe_loads.rs`'s `deployment_replicas_is_pinned_to_one` also
# parses `30-deployment.yaml` directly through this crate's own
# `load_manifest_bundle` (Task 2.3) to assert `spec.replicas == 1` —
# see that test's own doc comment for why this invariant is pinned.
admissionlab-installer = { workspace = true }
# `tests/kind_smoke.rs` (`#[ignore]`d — needs Docker and `kind`) drives
# the recipe through the real Task 2.4/2.6 install-and-wait pipeline
# against a real cluster, the same way `admissionlab-cluster`'s own
# `tests/kind_smoke.rs` (Task 1.9) drives cluster creation.
admissionlab-cluster = { workspace = true }
admissionlab-core = { workspace = true }
admissionlab-spec = { workspace = true }
# `test-util` gives `src/validate.rs`'s own tests Tokio's paused clock
# (`#[tokio::test(start_paused = true)]`), so a fixture's controlled
# delay -- up to `behavior::MAX_DELAY_MS`, a full minute -- is asserted
# in full without any wall-clock cost (Task 3.9 Step 2). A
# dev-dependency only: nothing in the shipped binary needs it, and the
# feature must not reach the image. The other features repeat the
# `[dependencies]` entry's because Cargo unifies the two, not because
# they are needed twice.
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "test-util",
] }
