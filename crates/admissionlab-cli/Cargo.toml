[package]
name = "admissionlab-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Task 4.14 gives this crate a library target alongside its binary. The
# whole compare-and-report half of `admissionlab test` is assembled here
# (see `pipeline`'s module documentation for why it cannot live in
# `admissionlab-core`), and the only way to drive that assembly through
# fake `ClusterManager`/`StackInstaller`/`FixtureCapture` backends from
# `tests/test_command.rs` — rather than only end-to-end through a real
# `kind` — is for those backends to be nameable from an integration test,
# which requires a `[lib]`. `tests/cli.rs` still exercises the compiled
# binary as a black box; the two are complementary, not redundant.
#
# Nothing outside this workspace consumes the library: it exists for
# testability, and `admissionlab` (the binary) is the product surface.
[lib]
name = "admissionlab_cli"
path = "src/lib.rs"

[[bin]]
name = "admissionlab"
path = "src/main.rs"

[dependencies]
# The Phase 3/4 pipeline `pipeline::run_lab` assembles end to end (Task
# 4.14). Every one of these is *downstream* of `admissionlab-core`, which
# is exactly why the assembly lands in this crate rather than in `core`:
# `core -> policy -> diff -> admission -> fixtures -> core` would be a
# cycle. Nothing depends on this bin+lib crate, so its own edges can
# never become part of one.
#
# - `admission`: `KubeFixtureCapture` (the `FixtureCapture` backend) and
#   the `AdmissionOutcome`/`AdmissionDecision` values the comparison reads.
# - `fixtures`: `discover_fixtures` over the resolved fixture selection.
# - `installer`: the `ComponentInstaller`/`ReadinessProbe` implementations
#   `pipeline::install::KubeStackInstaller` drives `install_stack` with.
# - `normalize`: `normalize_object`/`normalize_trace` plus the profile the
#   recipe-rule conversion seam builds.
# - `diff`: the semantic comparison and first-divergence attribution.
# - `policy`: `validate_policy_spec` (called before any cluster is
#   created), expectations loading, and `evaluate_with_expectations`.
# - `report`: `LabResult`, redaction, and the three renderers.
admissionlab-admission = { workspace = true }
admissionlab-diff = { workspace = true }
admissionlab-fixtures = { workspace = true }
# `pipeline::gateway` drives the whole Phase 6 engine -- applying a
# suite's manifests, waiting for each route's status, resolving the
# data-plane endpoint, port-forwarding to it, and probing through it --
# and `pipeline::compare` pairs the two sides' `GatewayCaseResult`s into
# the `GatewayCaseComparison` a report carries. Both are
# `admissionlab-gateway` types that `admissionlab-core` cannot name
# (`gateway -> core` is the real edge; the reverse would be a cycle), so
# the Gateway port is declared in this crate for exactly the reason the
# compare-and-report half already lives here. See
# `pipeline::gateway`'s own module documentation.
admissionlab-gateway = { workspace = true }
admissionlab-installer = { workspace = true }
admissionlab-normalize = { workspace = true }
admissionlab-policy = { workspace = true }
# Read-only lookup of the certified compatibility matrix
# (`compatibility/recipes.yaml`) for `pipeline::certification`'s
# uncertified-combination warning (Task 7.4 step 3). Already in this
# crate's transitive graph -- `admissionlab-admission` depends on it --
# so this promotes an existing edge to a direct one rather than adding a
# crate; nothing depends on this bin+lib crate, so its edges can never
# become part of a cycle. Deliberately NOT a way for the pipeline to
# gain recipe-driven install behavior: the only API used is the
# compatibility matrix, and the warning it produces can never refuse a
# run (Global Constraint 6).
admissionlab-recipes = { workspace = true }
admissionlab-report = { workspace = true }
# `pipeline::install::KubeStackInstaller` implements
# `admissionlab_core::StackInstaller`, and `pipeline::LabBackend` is the
# injection seam tests substitute fakes through: both are async traits.
async-trait = { workspace = true }
# The failure-path `diagnostics.json` artifact
# (`pipeline::report::FailureArtifact`) is serialized directly rather
# than hand-formatted, so it stays machine-readable alongside
# `result.json`.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Read-only lookup of the Kubernetes compatibility matrix
# (`compatibility/kubernetes.yaml`) for `doctor`'s kubectl client/server
# skew warning. Depending on both `admissionlab-cluster` and
# `admissionlab-core` from this bin-only crate is safe regardless of the
# edge between those two crates themselves. The true, load-bearing
# invariant (corrected here after Task 1.7, which added the edge this
# comment used to forbid): `admissionlab-cluster -> admissionlab-core`
# is a required one-way edge — `crates/admissionlab-cluster/Cargo.toml`
# depends on `admissionlab-core` for `ProcessRunner`, `RunPaths`, `Side`,
# and the `ClusterManager` trait its `KindClusterManager` implements —
# and `admissionlab-core` must never depend back on `admissionlab-cluster`.
# That reverse edge is the one that would create a cycle: Task 1.10
# places `LabRunner<C: ClusterManager>` inside `admissionlab-core` itself,
# and `ClusterManager::create`'s own signature already takes
# `admissionlab-core`'s `RunPaths` (with `ClusterSpec` holding a `Side`),
# so the trait and its data types had to live in `admissionlab-core`
# (Controller Ruling R22) rather than in `admissionlab-cluster`. Nothing
# depends on this bin-only crate, so `admissionlab-cli`'s own dependency
# edges here can never themselves become part of a cycle either way.
admissionlab-cluster = { workspace = true }
admissionlab-core = { workspace = true }
# `commands::test::run` loads and resolves the lab configuration through
# `admissionlab_spec::{load_lab, resolve_lab}` before handing the result
# to `admissionlab_core::LabRunner::prepare_clusters` (Task 1.10).
admissionlab-spec = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# `rt`: `doctor` drives `admissionlab-core`'s async `ProcessRunner` calls
# from a hand-rolled `Builder::new_current_thread().block_on(..)` runtime
# (mirroring `admissionlab-core`'s own `tests/artifact.rs`) rather than
# `#[tokio::main]`, so this crate never needs the `macros` feature.
# `fs`: `doctor --deep`'s real probe (Task 1.9) best-effort removes its
# own temporary workspace directory after deleting its temporary cluster
# (`tokio::fs::remove_dir_all` in `commands::doctor::run_deep_probe`).
# `signal`: `cancel::install` watches `SIGINT`/`SIGTERM` through
# `tokio::signal` so a run can be canceled cooperatively (Task 9.6)
# rather than dying mid-`kind create` and leaking a cluster. Required in
# production, not only in dev-dependencies — the watch is what
# `commands::test`/`commands::reproduce` install before driving the
# pipeline.
tokio = { workspace = true, features = ["rt", "fs", "signal"] }

[dev-dependencies]
assert_cmd = { workspace = true }
# `tests/exit_codes.rs` (Task 9.2) freezes every typed failure to its
# exit code by constructing one value of each variant, and
# `SpecError::InvalidGlob` carries a `globset::Error` that has no public
# constructor other than a real rejected pattern. Already resolved in
# `Cargo.lock` at this version through `admissionlab-spec`, so this is a
# promotion of an existing transitive dependency to a direct dev one
# rather than a new crate in the graph.
globset = { workspace = true }
predicates = { workspace = true }
# `tests/diff_benchmark.rs` (Task 5.7) synthesizes 100 pre-captured
# fixture outcome pairs whose webhook traces carry real RFC 6902 patches,
# because `admissionlab_normalize::normalize_trace` and
# `admissionlab_diff::diff_admission_trace` are part of the pass being
# measured and an empty patch list would exercise neither. The type is
# `admissionlab_admission::WebhookInvocation::patch`'s own
# (`json_patch::PatchOperation`); already resolved in `Cargo.lock` at
# this exact version through that crate, so this is a promotion of an
# already-fetched transitive dependency to a direct dev one.
json-patch = { workspace = true }
# `tests/test_command.rs` drives `pipeline::run_lab` against fakes on a
# hand-rolled current-thread runtime and parses the `result.json` it
# writes back as generic JSON (`LabResult` is emit-only by design, so
# there is no typed reader to use instead).
serde_json = { workspace = true }
# `tests/gateway_demo.rs` parses the example's two `ReferenceGrant`
# manifests to prove they differ in exactly one field. Parsed rather than
# text-diffed so a comment change cannot fail the assertion; the same
# YAML reader `admissionlab-spec` and `admissionlab-recipes` already use,
# rather than a second one that could disagree about a document.
serde_norway = { workspace = true }
tokio = { workspace = true, features = ["rt", "fs", "time"] }
