[package]
name = "admissionlab-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "admissionlab"
path = "src/main.rs"

[dependencies]
# Read-only lookup of the Kubernetes compatibility matrix
# (`compatibility/kubernetes.yaml`) for `doctor`'s kubectl client/server
# skew warning. Depending on both `admissionlab-cluster` and
# `admissionlab-core` from this bin-only crate is safe regardless of the
# edge between those two crates themselves. The true, load-bearing
# invariant (corrected here after Task 1.7, which added the edge this
# comment used to forbid): `admissionlab-cluster -> admissionlab-core`
# is a required one-way edge — `crates/admissionlab-cluster/Cargo.toml`
# depends on `admissionlab-core` for `ProcessRunner`, `RunPaths`, `Side`,
# and the `ClusterManager` trait its `KindClusterManager` implements —
# and `admissionlab-core` must never depend back on `admissionlab-cluster`.
# That reverse edge is the one that would create a cycle: Task 1.10
# places `LabRunner<C: ClusterManager>` inside `admissionlab-core` itself,
# and `ClusterManager::create`'s own signature already takes
# `admissionlab-core`'s `RunPaths` (with `ClusterSpec` holding a `Side`),
# so the trait and its data types had to live in `admissionlab-core`
# (Controller Ruling R22) rather than in `admissionlab-cluster`. Nothing
# depends on this bin-only crate, so `admissionlab-cli`'s own two
# dependency edges here can never themselves become part of a cycle
# either way.
admissionlab-cluster = { workspace = true }
admissionlab-core = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# `rt`: `doctor` drives `admissionlab-core`'s async `ProcessRunner` calls
# from a hand-rolled `Builder::new_current_thread().block_on(..)` runtime
# (mirroring `admissionlab-core`'s own `tests/artifact.rs`) rather than
# `#[tokio::main]`, so this crate never needs the `macros` feature.
# `fs`: `doctor --deep`'s real probe (Task 1.9) best-effort removes its
# own temporary workspace directory after deleting its temporary cluster
# (`tokio::fs::remove_dir_all` in `commands::doctor::run_deep_probe`).
tokio = { workspace = true, features = ["rt", "fs"] }

[dev-dependencies]
assert_cmd = { workspace = true }
async-trait = { workspace = true }
predicates = { workspace = true }
