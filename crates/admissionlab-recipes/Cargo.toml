[package]
name = "admissionlab-recipes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# `Capability` / `InstallMethod` / `ReadinessCheck` / `RecipeNormalizeRule`
# (Controller Ruling R30, Task 2.5): `admissionlab-spec` owns the
# resolved install/readiness/normalize/capability vocabulary because
# `ResolvedComponent::capabilities` already references `Capability` and
# `admissionlab-spec` must stay a leaf crate -- this crate reuses those
# types from there rather than redefining them. `admissionlab-spec`
# depends on none of this workspace's other crates, so this is a safe,
# one-way edge -- the same shape `admissionlab-installer`'s own
# dependency on `admissionlab-spec` already has. Deliberately NOT a
# dependency on `admissionlab-diff` or `admissionlab-policy`: PRODUCT.md
# §14 / Global Constraint 6 require this crate to carry no regression-
# classification logic at all, and neither of those crates is even
# reachable from here to begin with (verify with `cargo metadata
# --no-deps`, not by grepping this file -- Task 2.5's own report records
# that check).
admissionlab-spec = { workspace = true }
# The recipe YAML schema (`model::RawRecipe` and friends) is parsed with
# `serde`'s derive macros, the same `rename_all = "camelCase",
# deny_unknown_fields` convention `admissionlab-spec::model` documents
# and uses throughout -- deny_unknown_fields is exactly what makes an
# unrecognized key (`failOn`, `severity`, or anything else PRODUCT.md
# §14 does not list) a hard parse error at every nesting level, not
# merely at the top of the document.
serde = { workspace = true, features = ["derive"] }
# Recipe documents are YAML, parsed the same way `admissionlab-spec`
# parses `admissionlab.yaml` (`serde_norway::from_str`) -- see the root
# `Cargo.toml`'s comment on this dependency for why `serde_norway`
# rather than the archived `serde_yaml`.
serde_norway = { workspace = true }
# `RecipeError`'s variants (failed read, failed parse, failed semantic
# validation) mirror `admissionlab_spec::SpecError`'s own shape and use
# the same `#[derive(Error)]` convention.
thiserror = { workspace = true }

[dev-dependencies]
# `tests/kyverno_recipe.rs` (Task 2.8, `#[ignore]`d -- needs Docker and
# `kind`) drives this crate's now-built-in Kyverno recipe through the
# real Task 2.4/2.6 install-and-wait pipeline against a real cluster,
# mirroring `admissionlab-test-webhook`'s own `tests/kind_smoke.rs`
# (which dev-depends on this exact same crate set, from the other
# direction of this edge). None of these three crates depends back on
# `admissionlab-recipes`, dev or otherwise (verified via `cargo metadata
# --no-deps`), so this introduces no cycle.
admissionlab-cluster = { workspace = true }
admissionlab-core = { workspace = true }
admissionlab-installer = { workspace = true }
# `tests/kyverno_recipe.rs` builds a `ResolvedComponent` directly (not
# re-exported from this crate's own root -- see `lib.rs`) to hand to
# `admissionlab_installer::install_stack`.
admissionlab-spec = { workspace = true }
# `tests/kyverno_recipe.rs` is `#[tokio::test]`-based, the same feature
# set `admissionlab-cluster`'s own `tests/kind_smoke.rs` uses for the
# same reason (see that crate's `Cargo.toml` comment): `macros` for
# `#[tokio::test]` itself, `rt` for the runtime it runs on --
# `rt-multi-thread` is not needed since this test's only concurrency is
# real child processes (`kind`, `helm`, `kubectl`) progressing
# independently at the OS level, not multiple executor threads.
tokio = { workspace = true, features = ["rt", "macros"] }
# `tests/istio_recipe.rs` (Task 2.9) reads a fixture Pod back as
# `kubectl get ... -o json` and parses its `spec.initContainers`/
# `spec.containers`/`metadata.annotations` directly, rather than a
# jsonpath filter expression (`[?(@.name=="istio-proxy")]`) that would be
# harder to get right for a nested structure like this -- the same
# `serde_json::Value`-based approach
# `admissionlab_installer::readiness` itself already takes for every
# real readiness check. Already a workspace-pinned version (root
# `Cargo.toml`, used directly by `admissionlab-installer`); this is only
# a new *dev*-dependency edge, not a new crate in the dependency graph.
serde_json = { workspace = true }
