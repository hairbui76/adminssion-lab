[package]
name = "admissionlab-installer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# `helm.rs`'s `HelmInstaller` (Task 2.2) is a `ProcessRunner`-driven
# `ComponentInstaller` that shells out to `helm`, mirroring
# `admissionlab-cluster`'s `KindClusterManager` shelling out to `kind`.
# `ClusterHandle` (the only cluster-side type an installer needs -- its
# kubeconfig) is re-exported from here, not from `admissionlab-cluster`;
# see `admissionlab-core`'s `cluster` module documentation for why the
# trait and its data types live here rather than in a downstream cluster
# crate. This crate does NOT depend on `admissionlab-cluster` at all --
# see this crate's own `lib.rs` module documentation.
admissionlab-core = { workspace = true }
# `ResolvedComponent` / `InstallMethod` / `component::HelmInstallSpec`
# (Controller Ruling R30: `admissionlab-spec` owns the resolved install
# vocabulary, this crate owns the behavior that acts on it).
# `admissionlab-spec` depends on none of this workspace's other crates,
# so this is a safe, one-way edge -- the same shape `admissionlab-core`'s
# own dependency on `admissionlab-spec` already has.
admissionlab-spec = { workspace = true }
# Required on `impl ComponentInstaller for HelmInstaller` itself, not
# only on the trait definition: `async_trait`'s desugaring must match on
# both sides for the impl to typecheck.
async-trait = { workspace = true }
# Parses `helm get metadata -o json`'s structured output (Task 2.2 brief
# Step 3) the same way `admissionlab_core::tool::parse_kubectl_version`
# parses `kubectl version --output=json`: as a `serde_json::Value`, so a
# well-formed-but-differently-shaped response degrades to a diagnostic
# instead of a mis-extracted value. No `serde` derive needed for this --
# reading one field out of a `Value` is enough. `manifests.rs` (Task 2.3)
# also uses this to represent every parsed manifest document
# (`ManifestBundle::documents`) and to parse a `.json` manifest file
# directly.
serde_json = { workspace = true }
# `manifests.rs` (Task 2.3) parses a `.yaml`/`.yml` manifest file as a
# (possibly multi-document) YAML stream via `serde_norway::Deserializer`,
# then converts each document into a `serde_json::Value` -- see that
# module's documentation. No derive feature needed: nothing here derives
# `Serialize`/`Deserialize` for one of this crate's own types.
serde_norway = { workspace = true }
# The base `serde` crate itself, not only `serde_json`/`serde_norway`:
# `manifests.rs` calls `serde_json::Value`'s existing `Deserialize` impl
# generically against a `serde_norway::Deserializer` document, which
# requires naming the `Deserialize` trait directly -- neither
# `serde_json` nor `serde_norway` re-exports it. No derive feature
# needed for the same reason `serde_json` above needs none.
serde = { workspace = true }
# Computes `ManifestBundle::source_hash` (Task 2.3): SHA-256 of every
# manifest file's canonical source bytes. See the root `Cargo.toml`
# comment on this dependency for the version-pin reasoning.
sha2 = { workspace = true }
thiserror = { workspace = true }
# `readiness.rs` (Task 2.4) reads `Deployment`/`DaemonSet`/`Job`/webhook
# objects through these generated types, and drives the Kubernetes API
# through `kube::Client`/`Api<K>`. See the root `Cargo.toml`'s comments on
# both entries for why each is pinned centrally (version feature choice)
# there rather than here, and why no separate `[dev-dependencies]` entry
# is needed for either: this crate's own non-test code already needs both,
# so its tests inherit the same, already-resolved dependency -- there is
# no "tests only" gap for either to fill.
k8s-openapi = { workspace = true }
kube = { workspace = true }
# `time`: `readiness.rs`'s `poll_readiness` calls `tokio::time::sleep`
# itself, in production (not only test) code, to wait out each capped
# backoff interval between poll attempts -- so this feature belongs in
# `[dependencies]`, not only `[dev-dependencies]`, for the same v2-resolver
# reason `admissionlab-core`'s own `tokio` entry documents (a plain
# `cargo build -p admissionlab-installer --lib` would otherwise fail to
# compile even though `cargo test` would not catch it). No `rt` feature
# here: nothing in this crate's own production code spawns a task --
# `[dev-dependencies]` below still needs `rt` for `#[tokio::test]` itself.
tokio = { workspace = true, features = ["time"] }
# `readiness.rs`'s `poll_readiness` logs a transient fetch error (a
# retried, not fatal, poll attempt) at `debug` level, so a `RUST_LOG`-
# enabled run can distinguish "never observed, no attempts ever errored"
# from "every attempt errored" -- PRODUCT.md §33 diagnosability, without
# changing `ReadinessEvidence`'s own (canonical, fixed) shape. Already a
# workspace dependency used by `admissionlab-core`/`admissionlab-cli`; no
# new supply-chain surface.
tracing = { workspace = true }

[dev-dependencies]
# `tests/helm_unit.rs` drives `ComponentInstaller::install` (an `async
# fn`) against a fake `ProcessRunner`, so it needs to execute that
# future. `macros` is for `#[tokio::test]`; `rt` is the runtime it runs
# on. Nothing in this crate's own production code spawns a task, sets a
# timer, or touches the filesystem -- and the fake `ProcessRunner` used
# in tests never spawns a real process either -- so neither feature is
# needed outside `[dev-dependencies]`, unlike `admissionlab-core`'s own
# `tokio` entry (see that crate's `Cargo.toml` comment for the
# v2-resolver reasoning this mirrors).
tokio = { workspace = true, features = ["rt", "macros"] }
