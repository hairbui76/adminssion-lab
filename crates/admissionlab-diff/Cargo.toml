[package]
name = "admissionlab-diff"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# `admission.rs`'s `diff_admission_decision` (Task 4.4) takes
# `&admissionlab_admission::AdmissionOutcome` on both sides -- the
# roadmap's own frozen signature -- and classifies the pair's
# `AdmissionDecision` values. See the root `Cargo.toml`'s own comment on
# this entry for why this `diff -> admission` edge exists despite §1.1's
# shorter layering line, and why it is acyclic.
admissionlab-admission = { workspace = true }
# `SemanticChange::fixture_id` (Task 4.3) is an
# `admissionlab_core::FixtureId` -- the same identifier
# `admissionlab_admission::AdmissionOutcome` already carries, so a change
# and the outcomes it was derived from name the same fixture with the
# same type. This is this crate's only edge today, and a one-way one:
# `admissionlab-core` must never depend back on `admissionlab-diff` (the
# roadmap's own layering has `core` beneath everything, and Task 4.10's
# report reaches diff results through `admissionlab-report`, not through
# `core`).
admissionlab-core = { workspace = true }
# `workload.rs`'s `diff_workload_objects` (Task 4.5) takes
# `&admissionlab_normalize::NormalizedObject` on both sides -- the
# roadmap's own frozen signature -- and compares the normalized objects
# inside them. This is the `diff -> normalize` edge §1.1 draws
# explicitly; see the root `Cargo.toml`'s own comment on this entry for
# why it is acyclic. Comparing *normalized* objects rather than raw
# captured ones is the whole point: the noise a comparison must not
# report on has already been removed, and
# `NormalizedObject::evidence` records what that removal was.
admissionlab-normalize = { workspace = true }
# `trace.rs`'s `diff_admission_trace` (Task 4.6) takes
# `&admissionlab_spec::LatencyPolicy` -- again the roadmap's own frozen
# signature, and §1.2 gives that type to `admissionlab-spec` because it
# is a `policy.latency` section of a user's lab file. This crate reads
# the two configured thresholds and decides nothing about where they
# came from. A `diff -> spec` edge is acyclic for the same reason every
# other edge out of this crate is: `admissionlab-spec` depends only on
# `admissionlab-core` and third-party crates, and nothing may ever add a
# `spec -> diff` edge back.
admissionlab-spec = { workspace = true }
# `raw.rs` (Task 4.3) wraps `json_patch::diff` to produce this crate's
# own RFC 6902 `RawChange` diagnostics. See the root `Cargo.toml`'s own
# comment on this entry for the crate/library name mismatch and license
# status; see `raw.rs`'s module documentation for why the output type is
# this crate's own rather than `json_patch::PatchOperation` directly, and
# for the determinism argument that rests on `serde_json`'s
# `preserve_order` feature staying off in this graph.
json-patch = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# `SemanticChange::baseline`/`candidate` and `RawChange::value` are
# `serde_json::Value` directly, not merely serde-generic.
serde_json = { workspace = true }
