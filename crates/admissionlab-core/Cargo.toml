[package]
name = "admissionlab-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
# `run.rs`'s `LabRunner::prepare_clusters` takes `&admissionlab_spec::ResolvedLab`
# (Task 1.10 brief's own interface). This is a safe, one-way edge, unlike
# the forbidden `admissionlab-cluster` one documented on `cluster.rs`:
# `admissionlab-spec` depends on none of this workspace's other crates
# (only `globset`/`schemars`/`serde`/`serde_json`/`serde_norway`/`thiserror`),
# so there is no path back from it to `admissionlab-core` for this edge
# to complete into a cycle.
admissionlab-spec = { workspace = true }
# `run_manifest.rs` renders `RunManifest`'s two `SystemTime` fields as
# RFC 3339 (Task 5.1's pinned timestamp encoding). Formatting an instant
# as a calendar date requires real civil-time arithmetic, which `std`
# does not provide, so this needs a date library. `jiff` is the one this
# workspace already resolves (`k8s-openapi` depends on it directly, and
# `admissionlab-admission` parses audit timestamps with it), so this is a
# promotion of an already-fetched transitive dependency to a direct one
# rather than a new dependency — and it means a run manifest's
# timestamps are produced by the same library that already parses the
# Kubernetes timestamps this project reads. `default-features = false`
# for the reason the workspace entry documents: jiff's default feature
# set bundles an IANA time zone database this project has no use for,
# since a manifest timestamp is always a UTC instant.
jiff = { workspace = true }
# `run_manifest.rs` generates `schemas/run-manifest-v1alpha1.json` from
# the same derives that govern the manifest's own serialization, so the
# published schema can never drift from what Admission Lab actually
# writes — the identical arrangement `admissionlab-spec` already uses for
# `schemas/admissionlab-v1alpha1.json`.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# `run_manifest.rs` computes every `*_sha256` field in the run manifest.
# Same crate and same 0.10 pin as `admissionlab-fixtures`'s own fixture
# hashing, so a hash recorded in the manifest and a hash computed by
# fixture discovery are the same function of the same bytes.
sha2 = { workspace = true }
# Used by `artifact.rs`'s `ArtifactStore::write_json_atomic` in
# production code (not only by tests), so it belongs here rather than
# under `[dev-dependencies]` — the same v2-resolver reasoning as the
# comment on `tokio`'s `rt` feature below.
serde_json = { workspace = true }
thiserror = { workspace = true }
# Emits a warning when `artifact.rs`'s owner-only permission logic is
# compiled for a non-Unix target it cannot actually enforce permissions
# on, so that degradation is visible at runtime rather than silent.
tracing = { workspace = true }
# `rt` is required here, not only in dev-dependencies: `process.rs`
# itself calls `tokio::spawn`/uses `tokio::task::JoinHandle` (both
# gated behind the `rt` feature) to drain the child's stdout/stderr
# pipes concurrently with `wait()`. Cargo's v2 feature resolver keeps
# dev-dependency-only features out of a plain library build, so if
# `rt` lived only under `[dev-dependencies]`, `cargo build -p
# admissionlab-core --lib` (or any downstream crate depending on this
# one for its production build, not its tests) would fail to compile
# even though `cargo test` — which pulls in dev-dependencies for every
# target in the same build — would not catch it. `fs` is required for
# the same reason: `artifact.rs`'s `ArtifactStore` performs its
# directory creation and atomic writes through `tokio::fs`. `macros` is
# required in production (not only dev-dependencies) here too:
# `run.rs`'s `LabRunner::prepare_clusters`/`cleanup` call `tokio::join!`
# to create/delete the baseline and candidate clusters concurrently
# (Task 1.10) — `tokio::join!` itself, not just `#[tokio::test]`, needs
# this feature.
# `sync` is required in production too (Task 6.7): `process.rs`'s
# `ManagedChild` hands a long-lived child's stdout to its owner one line
# at a time over a `tokio::sync::mpsc` channel, fed by the same
# background pump task that keeps the pipe drained. The same v2-resolver
# reasoning as `rt`/`fs`/`macros` above applies — a dev-dependency-only
# feature would not reach a plain library build.
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
uuid = { workspace = true, features = ["v4"] }

# `tool.rs`'s disk-space check needs `statvfs`, which has no safe std
# wrapper and no portable equivalent outside Unix. `nix` provides a safe
# (non-`unsafe`) wrapper, so it is scoped to `cfg(unix)` here rather than
# declared as an unconditional dependency: on a non-Unix target it is
# never fetched or built at all, matching `tool.rs`'s `#[cfg(not(unix))]`
# fallback, which reports the check as indeterminate rather than calling
# into this crate.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

# `tests/process.rs` re-invokes itself as a child process to test the
# runner in this crate without depending on any external binary (see
# that file's module doc). Doing so requires full control over `fn
# main`, which the default libtest harness does not give: its
# generated `main` treats argv as test-name filters and prints its own
# banner to stdout before any #[test] body runs, which would corrupt
# the byte-for-byte stdout captures those tests rely on.
[[test]]
name = "process"
path = "tests/process.rs"
harness = false

# `tests/process_hardening.rs` re-invokes itself as a child (and as a
# grandchild) for the same reason `tests/process.rs` does, and needs the
# same full control over `fn main`: the default libtest harness would
# parse argv as test filters and print its banner into the byte-exact
# stdout captures these tests assert on. See that file's module doc.
[[test]]
name = "process_hardening"
path = "tests/process_hardening.rs"
harness = false
