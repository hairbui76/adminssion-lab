[package]
name = "admissionlab-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# `model.rs` (Task 6.1) re-exports `admissionlab_spec::GatewaySuiteSpec`,
# `RouteContract`, and `HttpProbeContract` rather than declaring twins:
# §1.2's registry freezes `GatewaySuiteSpec` on
# `admissionlab_spec::ResolvedLab`, and a `spec -> gateway` edge would be
# a cycle (this crate depends on `admissionlab-core`, which depends on
# `admissionlab-spec`), so the canonical definition has to live in
# `admissionlab-spec` and be named from here. §1.1 draws this crate's
# edges as `gateway -> cluster/fixtures/core domain types` and does not
# list `spec` -- but `spec` is already in this crate's graph transitively
# through `core`, so this promotes an existing transitive dependency to a
# direct one rather than adding a new arrow to the graph. See
# `admissionlab_spec::GatewaySuiteSpec`'s own documentation for the
# ownership argument in full.
admissionlab-spec = { workspace = true }
# `model.rs` uses no `admissionlab-core` type yet; Tasks 6.2/6.4 do
# (`ClusterHandle` and `Diagnostic` are both in their roadmap-frozen
# signatures). The edge is declared here, with Task 6.1, because it is
# the edge §1.1 draws for this crate (`gateway -> cluster/fixtures/core
# domain types`) and because it is what makes `admissionlab-spec`, above,
# an already-transitive dependency rather than a new one.
#
# §1.1 *also* lists `core -> gateway  # only used after Gateway feature
# is enabled`, which cannot coexist with this edge -- Cargo rejects the
# cycle outright. This workspace has already resolved exactly that shape
# once, in the same direction: `admissionlab-core`'s own `run.rs`
# documents why the compare-and-report half of the pipeline is assembled
# in `admissionlab-cli` rather than in `core`, and
# `admissionlab_core::FixtureCapture` is the pattern for the case where
# `core` genuinely must drive a higher crate -- a trait declared in
# `core` using only core-visible types and implemented in the higher
# crate. Whoever integrates the Gateway suite into an orchestrated run
# (Task 6.10 and later) must use that shape. A literal `core -> gateway`
# dependency must never be added.
admissionlab-core = { workspace = true }
# `diff.rs` (Task 6.9) returns `Vec<admissionlab_diff::SemanticChange>` --
# the roadmap's own frozen signature for `diff_gateway` -- and the nine
# Gateway kinds it emits are variants of that crate's
# `SemanticChangeKind`. One semantic-change vocabulary is the point: a
# Gateway regression is graded by `admissionlab-policy`, named in a
# user's `expectations.yaml`, and rendered by every report through
# exactly the same type an admission regression is. §1.1 does not draw
# this arrow, but the frozen signature does -- the same argument this
# workspace already recorded for its `diff -> admission` edge. Acyclic
# in the only direction that matters: `admissionlab-diff` depends on
# `admission`, `normalize`, `spec` and `core`, none of which reach back
# here, and a `diff -> gateway` edge must never be added (the comparator
# lives here precisely so that arrow stays absent).
admissionlab-diff = { workspace = true }
# `apply.rs` (Task 6.2) resolves each manifest document's
# `apiVersion`/`kind` against the live cluster through
# `admissionlab_fixtures::ResourceResolver`/`KubeResourceResolver`
# instead of guessing a plural from the kind (Global Constraint 15; see
# that module's own documentation for why guessing is observably wrong
# for real CRDs). This is the `gateway -> fixtures` edge §1.1 draws
# explicitly.
admissionlab-fixtures = { workspace = true }
# `apply.rs`'s `AppliedGatewayFixture::objects` is `Vec<ObjectKey>` --
# Task 6.2's own frozen signature -- and `ObjectKey` is
# `admissionlab_admission::correlate::ObjectKey`, §1.2's canonical name
# for "which object a request targeted". §1.1 does not draw a
# `gateway -> admission` edge, but the alternatives are worse: a second
# type with the same five fields under a different name is exactly the
# synonym §1.2's "these names are canonical" rule forbids, and lifting
# `ObjectKey` into `admissionlab-core` would rewrite a Phase 3 crate's
# public API for a Phase 6 convenience. This is the same resolution --
# and the same reasoning -- the workspace already recorded for its
# `diff -> admission` edge (see the root `Cargo.toml`): a roadmap-frozen
# signature stated in terms of another crate's type makes that edge real
# and intended rather than an oversight. Acyclic:
# `admissionlab-admission` depends on `admissionlab-fixtures` and
# `admissionlab-core`, neither of which depends on this crate, and
# nothing may ever add an `admission -> gateway` edge back.
admissionlab-admission = { workspace = true }
# `apply.rs` applies each Gateway fixture document through the dynamic
# (`DynamicObject`) API, so an arbitrary Gateway API or vendor CRD needs
# no generated Rust type, and reaches each cluster only through that
# cluster's own isolated kubeconfig.
# `reconcile.rs`'s `GatewayStatusSource` (Task 6.4) is an async trait,
# implemented both by the kube-backed production source and by
# `tests/reconcile_unit.rs`'s scripted one -- the same
# trait-with-an-offline-implementation shape every other seam in this
# workspace uses.
async-trait = { workspace = true }
# `probe.rs` (Task 6.8) speaks HTTP/1.1 to the local port-forward.
#
# The workspace tech-stack line names `reqwest`, and Task 8.6 will want
# its per-request TLS trust configuration -- but `reqwest` is not in
# `Cargo.lock` today, while `hyper` (1.11.1) already is, as a direct
# dependency of `admissionlab-echo` and `admissionlab-test-webhook` and
# transitively of `kube`'s own client stack. Adding a resolved crate's
# `client` feature is strictly smaller than adding an unresolved crate
# and its tree, so this uses what is already in the graph and leaves the
# `reqwest`-vs-`hyper` question to whichever task first needs something
# `hyper` genuinely cannot do.
#
# Two of Task 6.8's own requirements make the low-level client the
# *better* tool here rather than merely the cheaper one: "redirects
# disabled" is not a setting to remember but a property of the client
# (`hyper::client::conn` has no redirect logic to disable), and the
# retry rule needs to distinguish "the connection was refused before any
# response" from "the server answered 503", which is exactly the seam
# between `handshake`/`send_request` and the response this API exposes
# and a high-level client hides.
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client"] }
# `TokioIo` adapts a `tokio::net::TcpStream` onto hyper's own IO traits.
hyper-util = { workspace = true }
# `endpoint.rs` (Task 6.6) reads `Service.spec.ports` to turn a
# recipe-declared port *name* into a concrete port number. Unlike every
# Gateway API object this crate handles -- which is a CRD, has no
# generated Rust type, and is therefore read as a `DynamicObject` plus
# `serde_json::Value` (see `conditions.rs`) -- `v1/Service` is a core
# Kubernetes type `k8s-openapi` already generates, so hand-parsing its
# JSON here would be reimplementing a schema this workspace already
# links against. The same reasoning, and the same crate/version, as
# `admissionlab-installer`'s own typed `Deployment`/`DaemonSet`/`Job`
# readiness reads. Already in the resolved graph (`kube`'s `client`
# feature depends on it), so this promotes a transitive dependency to a
# direct one rather than adding a new crate -- and it is what makes a
# standalone `cargo build -p admissionlab-gateway` pick a `v1_*`
# Kubernetes feature explicitly rather than tripping `k8s-openapi`'s
# build-script panic (see the root `Cargo.toml`'s own comment).
k8s-openapi = { workspace = true }
kube = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Parses Gateway fixture manifests, which are ordinary (possibly
# multi-document) Kubernetes YAML -- the same parser, and the same
# `serde_yaml`-is-deprecated reasoning, as
# `admissionlab-installer`'s own manifest loader.
serde_norway = { workspace = true }
thiserror = { workspace = true }
# `reconcile.rs`'s capped-backoff poll loop sleeps between polls, and
# `port_forward.rs` (Task 6.7) bounds its readiness wait against a
# `tokio::time::Instant` deadline.
tokio = { workspace = true, features = ["time"] }
# `port_forward.rs` warns when a `kubectl port-forward` could not be
# killed, naming the pid and the exact `kill <pid>` an operator should
# run. That is a runtime degradation an operator has to see as it
# happens, not something a report written later can carry -- the same
# reason `admissionlab-core`'s own `artifact.rs` depends on `tracing`.
tracing = { workspace = true }

[dev-dependencies]
# The same `tower_test::mock`-backed `kube::Client` technique
# `admissionlab-fixtures`'s `resources.rs` and `admissionlab-admission`'s
# `tests/execute_unit.rs` already use: drives this crate's HTTP-level
# code against a scripted request/response exchange, never a live
# cluster. Pinned to the versions those crates' own test suites already
# resolve in `Cargo.lock`.
http = "1.5.0"
# `tests/probe.rs` drives the *real* echo backend
# (`admissionlab_echo::serve::serve_on`) on an ephemeral local port
# rather than hand-writing a stand-in for its frozen JSON contract, so
# `probe.rs`'s parser is asserted against the bytes that component
# actually produces. Dev-only: nothing in this crate's shipped code
# depends on the echo backend, and `probe.rs` deliberately does not
# import its `EchoBody` type -- see that module's own documentation for
# why the wire contract is shared but the Rust type is not.
admissionlab-echo = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
tower-test = "0.4.0"
