# Admission Lab's own deterministic dogfood admission webhook
# (PRODUCT.md §30, Task 2.7) — see `crates/admissionlab-test-webhook`'s
# own module documentation for what it does and why it exists: a
# component whose admission behavior is *known and deterministic*, so
# Admission Lab's own test suite never breaks for reasons that are
# actually a vendor's (Kyverno's, Istio's) behavior changing underneath
# it.
#
# Unlike `recipes/kyverno.yaml`/`recipes/istio.yaml` (Tasks 2.8/2.9),
# this recipe is *not* embedded as a built-in
# (`crates/admissionlab-recipes/src/load.rs`'s `BUILTIN_RECIPES`): it
# installs raw manifests, and `admissionlab-recipes`' own schema requires
# every `install.paths` entry to already be an absolute path (documented
# in that crate's `model.rs`, `resolve_manifests`) — an embedded built-in
# recipe's text has no filesystem location at all to make one absolute
# against. This is Task 2.5's own documented, deliberate scope
# limitation ("Revisit once a real manifests-based recipe needs relative
# paths and can settle this with a concrete use case" — this recipe is
# that first case), not something this task's own narrow scope
# (`crates/admissionlab-recipes/*` is not in Task 2.7's file list) is
# positioned to resolve for every future manifests-based recipe.
#
# Concretely, this means the four `${RECIPE_DIR}/...` entries below are
# NOT literal, ready-to-use paths: `${RECIPE_DIR}` is a placeholder a
# loader must substitute with this file's own directory's real absolute
# path (`.../recipes/test-webhook`) before parsing — exactly what
# `crates/admissionlab-test-webhook/tests/recipe_loads.rs` does, the same
# way, before calling `admissionlab_recipes::load_recipe_overrides` on
# the substituted copy. Loading this file completely unmodified (for
# example pointing `load_recipe_overrides` directly at this directory)
# fails loudly with "is relative" — by design (Global Constraint 15: a
# recipe with no well-defined absolute path to resolve against must
# never silently guess one).
#
# No `capabilities:` yet, deliberately: this recipe does not yet claim
# `admission` (PRODUCT.md §14 / `admissionlab_spec::Capability::Admission`)
# because the webhook it installs implements no admission-review request
# handling at all in Phase 2 (see
# `crates/admissionlab-test-webhook/src/serve.rs`'s own module
# documentation) and its `namespaceSelector` never routes a request to it
# regardless (`manifests/20-webhook-configuration.yaml`) — claiming a
# capability this component does not yet functionally provide would be
# exactly the kind of fabrication Global Constraint 15 rules out. Task
# 3.9, which implements that behavior for real, is the right place to add
# it.
name: test-webhook
version: 0.1.0
install:
  type: manifests
  paths:
    - "${RECIPE_DIR}/manifests/00-namespace.yaml"
    - "${RECIPE_DIR}/manifests/10-rbac.yaml"
    - "${RECIPE_DIR}/manifests/20-webhook-configuration.yaml"
    - "${RECIPE_DIR}/manifests/30-deployment.yaml"
readiness:
  # Gates on the Deployment actually being Available (Task 2.4) --not
  # merely applied -- and separately on the ValidatingWebhookConfiguration
  # object existing (see `manifests/20-webhook-configuration.yaml`'s own
  # comments for why that object is applied directly by this recipe
  # rather than created at runtime the way a real controller like
  # Kyverno's would be). A Deployment that is Available but whose webhook
  # configuration does not yet exist is not usable -- and the reverse
  # (webhook configuration present, Deployment not yet Available) is
  # exactly the ordering `admissionlab-installer::readiness`'s own module
  # documentation warns a readiness model must not silently accept.
  - type: deploymentAvailable
    namespace: admissionlab-test-webhook
    name: admissionlab-test-webhook
  - type: webhookConfigurationPresent
    name: admissionlab-test-webhook
