# NGINX Gateway Fabric certified recipe (ROADMAP Task 8.1) -- the second
# Gateway API implementation this project certifies, after
# `recipes/istio-gateway/`. See README.md in this same directory for the
# full story this file only summarizes: the upstream provenance behind
# every pin, why the chart is fetched from an OCI registry, the
# live-cluster measurements behind every readiness check below, and the
# three findings where NGF's observable behavior differs from Istio's.
#
# # This recipe is one half of a stack
#
# `gateway-api-crds.yaml`, in this same directory, installs the Gateway
# API CustomResourceDefinitions and must be composed BEFORE this
# component -- NGF's own documentation requires it ("the Gateway API
# resources from the standard channel must be installed before deploying
# NGINX Gateway Fabric"). Read that file's header for why the stack is
# split in two.
#
# NGF's OWN CustomResourceDefinitions (`NginxProxy`, `NginxGateway`,
# `SnippetsFilter` and eight more, all in the `gateway.nginx.org` group)
# are not a third component: the Helm chart carries them in its `crds/`
# directory, and Helm installs those directly rather than through
# `kubectl apply`. That distinction is not cosmetic here -- see "Why Helm
# and not manifests" below.
#
# # Chart pin: 2.6.7, from an OCI registry
#
#   chart:  oci://ghcr.io/nginx/charts/nginx-gateway-fabric
#   digest: sha256:5fd07b74794d4d21d3e5c14ec9cbf932384397a9f6c9af19cbcb49e0d6c7f06f
#
# 2.6.7 is the current stable release (published 2026-07-15) and is the
# release whose `go.mod` declares `sigs.k8s.io/gateway-api v1.5.1` --
# exactly the bundle `gateway-api-crds.yaml` installs. NGF's own
# technical-specifications page states the same pairing, plus
# "Kubernetes: 1.31+", for this release.
#
# # Why Helm and not manifests
#
# NGF also publishes plain manifests (`deploy/crds.yaml` plus
# `deploy/default/deploy.yaml` at the release tag), and vendoring those
# would have matched `gateway-api-crds.yaml`'s own local-first shape
# exactly. It does not work, and the reason is measured rather than
# assumed. `admissionlab_installer::manifests` applies with
# `kubectl apply --server-side=false`, which stores the entire applied
# object in a `kubectl.kubernetes.io/last-applied-configuration`
# annotation, and an annotation may not exceed 262,144 bytes. NGF's
# `NginxProxy` CRD serializes to 320,611 bytes. On a real Kubernetes
# 1.36.4 cluster:
#
#     The CustomResourceDefinition "nginxproxies.gateway.nginx.org" is
#     invalid: metadata.annotations: Too long: may not be more than
#     262144 bytes
#
# (For scale: the largest object in the Gateway API v1.5.1 bundle, the
# `HTTPRoute` CRD, is 243,898 bytes -- under the limit, which is why the
# CRD component above can use manifests at all.)
#
# Helm has no such problem: it records a release's manifest in its own
# Secret rather than in a per-object annotation, and a chart's `crds/`
# directory is installed with a plain create. So the install method here
# is not a style choice between two working options -- it is the one that
# can install this chart's CRDs.
name: nginx-gateway-fabric
version: "2.6.7"
install:
  type: helm
  # An OCI chart reference, and the first in this project. NGF publishes
  # its chart ONLY to this registry: its own installation documentation
  # gives no `helm repo add` command, and F5's classic repository at
  # https://helm.nginx.com/stable does not carry the chart (checked
  # against that repository's own index.yaml, which lists
  # `nginx-ingress`, `nginx-service-mesh` and others, but no
  # `nginx-gateway-fabric`).
  #
  # `admissionlab_installer::helm` recognizes the `oci://` scheme and
  # skips its `helm repo add` step for it -- not as an optimization but
  # because `helm repo add` speaks the classic HTTP index.yaml protocol
  # and cannot parse an OCI URL at all (measured against helm v3.20.0;
  # the exact error is quoted in that module's documentation). The same
  # helm then installed this exact chart with no repository registered.
  chart: oci://ghcr.io/nginx/charts/nginx-gateway-fabric
  # The registry path `chart` above is rooted at. Nothing runs `helm repo
  # add` with it -- an OCI reference locates itself -- and the field is
  # required anyway, on purpose: `repo` then always means "where this
  # chart comes from" instead of being a field whose emptiness silently
  # encodes which of two install paths was taken. See
  # `admissionlab_spec::model::HelmInstallSpec::repo`.
  repo: oci://ghcr.io/nginx/charts
  version: "2.6.7"
  # `repoName` deliberately unset: it names the alias `helm repo add`
  # would register, and no `helm repo add` runs for an OCI chart. It
  # defaults to this recipe's own name and is never used.
  #
  # `releaseName` deliberately unset TOO, and that one is load-bearing:
  # it defaults to this recipe's name, `nginx-gateway-fabric`, and the
  # chart names every object it creates after the release. The control
  # plane Deployment this recipe's readiness gates on below is therefore
  # `nginx-gateway/nginx-gateway-fabric` -- verified on a live cluster,
  # where a release named `nginx-gateway-fabric` produced exactly that
  # Deployment, Service, ServiceAccount and cert-generator Job. Setting
  # `releaseName` to anything else would rename the Deployment and break
  # the readiness check three lines further down, so the two are pinned
  # together by `crates/admissionlab-recipes/tests/nginx_gateway_recipe.rs`.
  namespace: nginx-gateway
readiness:
  # 1. The control plane itself. Measured on a real `kind` cluster
  #    (Kubernetes 1.36.4): `helm upgrade --install` returned in 12.5
  #    seconds, having run the chart's `cert-generator` Job to
  #    completion; the Deployment reached `Available=True` shortly after,
  #    once the `server-tls` Secret that Job creates existed for it to
  #    mount.
  #
  #    The name is `<release>-...`-derived; see the `releaseName` note
  #    above for why it reads `nginx-gateway-fabric` and not
  #    `nginx-gateway` (which is the NAMESPACE, and also the Deployment
  #    name in NGF's plain-manifest install, where there is no Helm
  #    release to name things after -- an easy and silent way to get this
  #    wrong).
  - type: deploymentAvailable
    namespace: nginx-gateway
    name: nginx-gateway-fabric
  # 2 & 3. The Gateway API itself is being served. `gateway-api-crds.yaml`
  #    already asserts this for the four kinds it installs, and this
  #    recipe restates it for the two its own capability is *about*
  #    rather than trusting that another component ran first. Composed
  #    without `gateway-api-crds-nginx`, this component now fails
  #    readiness naming the missing CRD instead of installing
  #    "successfully" and failing much later when a fixture's `Gateway`
  #    is rejected as an unknown kind.
  - type: customResourceCondition
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: gateways.gateway.networking.k8s.io
    conditionType: Established
    status: "True"
  - type: customResourceCondition
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: httproutes.gateway.networking.k8s.io
    conditionType: Established
    status: "True"
  # 4. The strongest of the four, and the reason the three above are not
  #    the whole story: `GatewayClass/nginx` reaching `Accepted=True`
  #    proves NGF's controller is *running and reconciling Gateway API
  #    objects on this cluster*, which no amount of "the CRD exists" and
  #    no Deployment condition can establish.
  #
  #    The chart creates this class (controller
  #    `gateway.nginx.org/nginx-gateway-controller`); the name `nginx` is
  #    NGF's own default and is what the controller is started with
  #    (`--gatewayclass=nginx`), and it is the class
  #    `fixtures/gateway/nginx/*.yaml` name in `spec.gatewayClassName`.
  #    Observed on a live cluster five seconds after the Helm install
  #    returned, alongside two further conditions this recipe does NOT
  #    gate on -- `SupportedVersion` ("The Gateway API CRD versions are
  #    supported") and `ResolvedRefs` (the class-level `NginxProxy` its
  #    `parametersRef` names). Both were `True`, and both are
  #    NGF-specific status this project has no certified meaning for;
  #    `Accepted` is the one Gateway API itself defines.
  - type: customResourceCondition
    apiVersion: gateway.networking.k8s.io/v1
    kind: GatewayClass
    name: nginx
    conditionType: Accepted
    status: "True"
capabilities:
  # This recipe's whole point. Note what is NOT here: `admission`. NGF
  # 2.6.7 registers no admission webhook of its own (Gateway API
  # validation moved into CEL rules in the CRDs themselves), and even if
  # it did, a capability is a claim about what this recipe has been
  # certified to do -- this one's fixtures and integration test exercise
  # Gateway API behavior only.
  - gatewayApi
# How Admission Lab finds the data plane for one `Gateway` installed
# through this recipe (Task 6.6's `gatewayEndpoint` metadata).
#
# Every value below was read off a live cluster, not from documentation.
# For `Gateway/lab-gateway` in namespace `admissionlab-nginx-gateway-same`,
# NGF provisioned:
#
#   Service/lab-gateway-nginx  (= <gateway name>-nginx)
#     labels:
#       gateway.networking.k8s.io/gateway-name: lab-gateway
#       app.kubernetes.io/name: lab-gateway-nginx
#       app.kubernetes.io/instance: nginx-gateway-fabric      <- release
#       app.kubernetes.io/managed-by: nginx-gateway-fabric-nginx
#     ports:
#       - name: port-80  port: 80  targetPort: 80
#
# plus a `Deployment/lab-gateway-nginx` carrying the same labels.
gatewayEndpoint:
  # By selector, not by name -- even though `<gateway>-nginx` is
  # perfectly predictable. The label is Gateway API's own documented
  # "gateway infrastructure label", which NGF applies because upstream
  # specifies it, whereas the `-nginx` suffix is NGF's own convention.
  # Selecting on the standard thing is the more durable of the two, and
  # it is the same selector `recipes/istio-gateway/recipe.yaml` uses --
  # so this one field is genuinely portable between the two
  # implementations even though nothing else about their data planes is.
  type: serviceBySelector
  namespace: "{gatewayNamespace}"
  selector:
    # The one label key, and the only substitution: the Gateway's own
    # name. Deliberately NOT also keyed on `app.kubernetes.io/instance`,
    # which carries the HELM RELEASE name -- selecting on that would make
    # this strategy silently wrong for anyone who installed the chart
    # under a different release name.
    gateway.networking.k8s.io/gateway-name: "{gatewayName}"
  # NEITHER `portName` NOR `port`, and that is a finding rather than an
  # omission -- it is the one place this recipe's endpoint metadata
  # genuinely differs from `recipes/istio-gateway/recipe.yaml`'s, which
  # must say `portName: http`.
  #
  # Istio's provisioned Service exposes two ports: the listener's, and
  # `status-port` 15021, which is Istio's own and which no fixture asks
  # for. With two candidates the resolver must be told which, and Istio
  # gives it a stable vendor-owned NAME to be told by.
  #
  # NGF's exposes exactly the Gateway's listener ports and nothing else
  # (its readiness port is added only when an `NginxProxy` sets
  # `nginxReadinessProbe.expose`, which nothing here does), and it names
  # each one `port-<number>` -- derived from the port, not chosen by the
  # vendor. So there is no vendor-stable name to select on, and pinning a
  # NUMBER here would put the FIXTURE's listener-port choice into the
  # RECIPE, making a fixture that binds 8080 unresolvable for no reason.
  #
  # With both fields unset, `admissionlab_gateway::endpoint`'s documented
  # rule resolves a single-port Service unambiguously, and a Gateway with
  # two listeners becomes a loud "the port is unresolvable, here are the
  # ports" error -- which is the honest answer, because at that point
  # this recipe genuinely does not know which one a probe means.
# No `normalizeRules:`. Not an omission -- a finding, and the same one
# `recipes/istio-gateway/recipe.yaml` records for a different vendor.
#
# Every object this recipe's fixtures create was read back from a live
# cluster after NGF had fully reconciled them. The `Gateway` and the
# `HTTPRoute` came back with `metadata.labels`, `metadata.annotations`
# and `metadata.finalizers` all absent -- NGF stamps nothing onto the
# objects a fixture declares. The only additions to any fixture object
# were Gateway API's own CRD schema defaults (`parentRefs[].group`/
# `kind`, `backendRefs[].group`/`kind`/`weight: 1`), which the API server
# writes from the CRD's schema, identically on every cluster serving the
# same bundle version, and which are therefore not nondeterminism to
# normalize away.
#
# NGF's genuinely nondeterministic output lives on objects it CREATES
# (the per-Gateway Deployment and Service, their pod names and resource
# versions -- which no fixture declares and no comparison reads) and in
# HTTP responses. NGF does add request headers on the way to a backend
# that Istio does not (`x-real-ip`, `x-forwarded-for`, `x-forwarded-host`,
# `x-forwarded-port`, `x-forwarded-proto`), and the echo backend reflects
# them in its response body -- but those are deterministic, they are a
# real behavioral difference between the two implementations rather than
# noise, and deleting them here would delete exactly the evidence a
# Gateway comparison exists to surface (PRODUCT.md §14: a normalization
# rule deletes evidence, so an unnecessary one silently narrows what a
# comparison can ever detect).
