name: Integration

on:
  pull_request:
    paths:
      - "crates/admissionlab-cluster/**"
      - "crates/admissionlab-installer/**"
      - "crates/admissionlab-recipes/**"
      - "crates/admissionlab-test-webhook/**"
      - "crates/admissionlab-admission/**"
      - "crates/admissionlab-gateway/**"
      - "crates/admissionlab-cli/**"
      - "recipes/**"
      - "fixtures/**"
      - "examples/**"
      - "testdata/**"
      # Task 5.4: the composite action and this workflow itself, so a
      # change to either is tested by the `action` and `action-failure`
      # jobs below -- a passing lab and a failing one -- rather than
      # discovered by the first downstream repository to use it.
      - ".github/actions/**"
      - ".github/workflows/integration.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    # `matrix.package` alone no longer names a matrix entry uniquely as of
    # Task 2.9: `admissionlab-recipes` now has two (`kyverno_recipe`,
    # `istio_recipe`), which would otherwise give both the identical job
    # display name in the GitHub Actions UI -- `matrix.test` is the actual
    # unique key across every entry (see the cache `key:` below, which has
    # the same requirement for the same reason).
    name: Real kind/Docker integration smoke test (${{ matrix.package }} / ${{ matrix.test }})
    runs-on: ubuntu-latest
    # Every `#[ignore]`d real-cluster test in this workspace runs here, one
    # matrix entry each -- `admissionlab-cluster`'s own `kind_smoke` (Task
    # 1.9), the Kyverno recipe certification test (Task 2.8), the Istio
    # recipe certification test (Task 2.9), the Istio *Gateway API*
    # recipe certification test (`istio_gateway_recipe`, Task 6.10 -- a
    # different Istio feature and a different recipe from Task 2.9's),
    # `admissionlab-test-webhook`'s
    # `kind_smoke` (Task 2.7), the Phase 2 Exit Gate sample lab
    # (`exit_gate`, Task 2.11), the Phase 3 fixture capture pipeline
    # (`kind_capture`, Task 3.10), and the Public Alpha exit gate
    # (`alpha_e2e`, Task 4.15). These used to exist only as a one-time
    # check a human could run by hand; none of them were reachable from any
    # CI workflow, so a real regression in any of them (a vendor chart's
    # next patch release breaking enforcement, a dependency bump breaking
    # cluster creation, an upstream change to the audit annotations this
    # project reconstructs webhook traces from) would go undetected
    # forever. `fail-fast: false` so one matrix entry failing does not
    # cancel the others -- with eight independent real-cluster tests,
    # losing signal on the rest the moment the first one fails would defeat
    # the point of running all eight.
    #
    # Deliberately parallel *jobs* (via matrix), not sequential `run:`
    # steps in one job: each of these tests creates and tears down at least
    # one real `kind` cluster (occasionally two, for the isolation test;
    # once per certified Kubernetes version -- today three -- for the
    # Istio recipe test) plus, for `admissionlab-test-webhook`, a real
    # `docker build` -- running them as separate jobs means total
    # wall-clock is bounded by the slowest single test, not their sum, and
    # a failure in one cannot prevent the runner from even attempting the
    # others (sequential steps in one job would need `if: always()` on
    # every step after the first just to get that same guarantee, and
    # would still serialize wall-clock time). The one shared cost of
    # separate jobs -- repeating checkout/kind-install per matrix entry --
    # is a few seconds each, negligible next to what each test itself
    # takes.
    #
    # `kind_capture` (Task 3.10) is a `docker build` + cluster + stack
    # install + 10 real dry-run requests, measured end to end at 83.80
    # seconds on the reference machine with a warm node-image and Docker
    # layer cache. It sits comfortably inside the shared ceiling below;
    # its own internal bounds (a 600-second image build, a 120-second
    # component install, a 10-second audit correlation deadline per
    # fixture) are what actually stop it hanging.
    #
    # `alpha_e2e` (Task 4.15) is the Public Alpha exit gate: the canonical
    # `examples/kyverno-istio-upgrade` demo driven through the compiled
    # `admissionlab` binary, twice. Each invocation creates two `kind`
    # clusters, installs a real Kyverno and a real Istio on each, replays
    # nine fixtures per side, and deletes both clusters; the second
    # invocation exists to compare the two runs' semantic-change sets,
    # which is the only way a *single* test can demonstrate Global
    # Constraint 7's determinism at all. Measured end to end at 169.33
    # seconds on the reference machine (89.7s + 79.6s) with a warm
    # node-image and image cache. It is the one matrix entry whose cost is
    # dominated by container image pulls rather than by Rust or by `kind`,
    # so a cold GitHub-hosted runner will be several times slower than
    # that figure -- still well inside the shared ceiling below. Its own
    # internal bound is the CLI's 600-second per-component install
    # timeout.
    #
    # timeout-minutes: 30, sized against the Istio recipe certification
    # test (`istio_recipe`) -- the heaviest matrix entry, since
    # `compatibility/recipes.yaml`'s `istio` entry currently certifies
    # three Kubernetes versions and this test creates one disposable `kind`
    # cluster per certified version, sequentially. Measured end to end
    # while writing this workflow entry: 222.00 seconds (~3m42s) total for
    # all three certified-version iterations combined -- two of them a
    # genuinely cold `kind` node pulling both the node image and
    # `istiod`'s image for the first time -- on an unloaded machine. 30
    # minutes leaves roughly 8x headroom above that measured figure for a
    # slower/loaded GitHub-hosted runner, comfortably more margin than the
    # previous version of this comment gave `admissionlab-test-webhook`'s
    # `kind_smoke` (its own ~14 minutes of internal, deliberately generous
    # timeouts, given 20 minutes of ceiling). The other matrix entries
    # (`kind_smoke` on `admissionlab-cluster`, `kyverno_recipe` on
    # `admissionlab-recipes`, `kind_smoke` on `admissionlab-test-webhook`)
    # finish well under this in practice -- `kyverno_recipe` measured
    # 113.97s end to end on a warm node-image cache while it was written --
    # a generous shared ceiling
    # costs nothing when a job ends the moment it completes rather than
    # waiting out the timeout.
    # `matrix.timeout` overrides it per entry, and exactly one entry sets
    # it: `gateway_demo` (Task 6.12) runs the whole canonical Gateway
    # lab four times over -- once for the finding, twice more for the
    # determinism check, once for the message-preservation check -- and
    # each run creates two clusters and installs two full Istio stacks.
    # Measured at 204.5 s per run on the reference machine with a warm
    # cache; four of those plus the image build is already ~15 minutes
    # before any runner slowness, which leaves too little of a 30-minute
    # ceiling to be honest about. An expression rather than a second job:
    # every other step in this job is identical for that entry.
    timeout-minutes: ${{ matrix.timeout || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: admissionlab-cluster
            test: kind_smoke
          - package: admissionlab-recipes
            test: kyverno_recipe
          - package: admissionlab-recipes
            test: istio_recipe
          # Task 6.10. Like `istio_recipe`, this entry creates one
          # disposable cluster per Kubernetes version
          # `compatibility/recipes.yaml` certifies (today three), and it
          # additionally runs `scripts/build-test-images.sh` once per
          # cluster to load the echo backend the traffic probes reach.
          # Measured end to end at 269.95 seconds (~4m30s) for all
          # three certified-version iterations combined, on the
          # reference machine with a warm node-image and Docker layer
          # cache -- the same order as `istio_recipe`'s own 222 s, which
          # is what the shared `timeout-minutes: 30` ceiling below was
          # already sized against. See
          # `recipes/istio-gateway/README.md`'s "What was measured" for
          # the per-step figures.
          - package: admissionlab-recipes
            test: istio_gateway_recipe
          - package: admissionlab-recipes
            test: exit_gate
          - package: admissionlab-test-webhook
            test: kind_smoke
          - package: admissionlab-admission
            test: kind_capture
          - package: admissionlab-cli
            test: alpha_e2e
          # Task 6.11. `admissionlab test` driving the whole Gateway
          # engine against two real clusters: two identical
          # `recipes/istio-gateway` stacks, the echo backend side-loaded
          # by the run itself through the configuration's `images:`
          # list, one route contract observed on each side, and one real
          # HTTP request through Envoy. Measured end to end at 156.1 s on
          # the reference machine with a warm node-image and Docker layer
          # cache.
          - package: admissionlab-cli
            test: gateway_e2e
          # Task 6.12, and the Phase 6 exit gate's own second command.
          # The canonical Gateway regression demonstration: the same lab
          # with one line of a `ReferenceGrant` changed on the candidate
          # side, asserted to exit 1 with the route, the changed
          # condition, its reason and the skipped traffic behavior in the
          # first user-facing failure -- and run twice over to prove the
          # finding is identical both times. See `matrix.timeout` above
          # for why this entry gets a larger ceiling than the rest.
          - package: admissionlab-cli
            test: gateway_demo
            timeout: 60
    steps:
      - name: Check out repository
        # v7.0.1: verified against the GitHub API
        # (api.github.com/repos/actions/checkout/releases/latest) on
        # 2026-08-30. Same pin already used by .github/workflows/ci.yml.
        uses: actions/checkout@v7.0.1

      - name: Cache Cargo registry, git deps, and target directory
        # v2.9.2: verified against the GitHub API
        # (api.github.com/repos/Swatinem/rust-cache/releases/latest) on
        # 2026-08-30. Same pin already used by .github/workflows/ci.yml.
        # `key` (verified against this exact pinned version's own
        # action.yml, not assumed): "An additional cache key that is added
        # alongside the automatic job-based cache key and can be used to
        # further differentiate jobs" -- set to the matrix package *and*
        # test name so the parallel matrix jobs (which otherwise share a
        # workflow/job name and would contend for the same cache entry)
        # each get their own. `matrix.package` alone stopped being unique
        # as of Task 2.9, which added a second `admissionlab-recipes` entry
        # (`istio_recipe`, alongside `kyverno_recipe`) -- without `test`
        # here too, those two jobs would silently share one cache entry.
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.package }}-${{ matrix.test }}

      - name: Verify Docker is reachable
        # No install step: GitHub-hosted `ubuntu-latest` runners ship
        # Docker Engine preinstalled and already running (confirmed
        # present in the runner image's own software inventory at Docker
        # Client/Server 28.0.4 as of this writing). This check exists so
        # a future runner-image change that drops Docker fails here, with
        # a clear message, rather than deep inside `kind create cluster`
        # (or, for `admissionlab-test-webhook`, `docker build`).
        run: docker version

      - name: Install kind v0.33.0
        # Pinned to the exact `kind` version this project has actually
        # validated its cluster lifecycle against (the same version whose
        # release the node-image digests in compatibility/kubernetes.yaml
        # were captured from), rather than trusting whichever `kind`
        # version a given runner image happens to ship (observed as
        # v0.32.0 in the runner image's inventory at the time this
        # workflow was written) -- CI tooling should be pinned as
        # deliberately as the Kubernetes node images themselves.
        # Downloaded directly from the upstream GitHub release and
        # checksummed against kind's own published
        # `kind-linux-amd64.sha256sum` for that release, rather than
        # adding and pinning a third-party GitHub Action just to fetch
        # one binary.
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64"
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind" | sha256sum -c -
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: Print kubectl version
        # Already present on the runner image (observed at v1.36.4,
        # matching this project's own Tier 1 primary supported version in
        # compatibility/kubernetes.yaml) -- printed here for diagnostics,
        # not installed.
        run: kubectl version --client=true

      - name: Run the real kind integration smoke test
        # Parameterized by the matrix: exactly one `#[ignore]`d real-cluster
        # test binary per job. `cargo test` itself fails (non-zero exit)
        # when the test fails, which fails this step, which fails this
        # matrix job, which fails the overall workflow run -- no swallowing
        # anywhere in this chain, and `fail-fast: false` above means that
        # failure does not hide whether the other matrix entries also
        # passed or failed.
        run: cargo test -p ${{ matrix.package }} --test ${{ matrix.test }} -- --ignored --nocapture

      - name: Verify no adlab-* cluster was left behind
        if: always()
        # PRODUCT.md §33: "no leaked cluster after normal failure paths".
        # This runner VM is discarded after the job regardless, but this
        # step still catches a real cleanup regression while it is easy
        # to diagnose, and best-effort deletes anything found rather than
        # leaving it running for the rest of this job's lifetime. Applies
        # unchanged to every matrix entry: `cluster_name` (the one
        # function every one of these tests calls to name its own cluster,
        # `admissionlab-cluster/src/kind.rs`) always produces the
        # `adlab-<side>-<short-run-id>` form regardless of which crate
        # calls it, and each matrix job's `kind get clusters` only ever
        # sees clusters created inside its own isolated runner VM.
        run: |
          set -euo pipefail
          # Distinguish "kind failed" from "kind reported zero clusters".
          # `kind get clusters 2>/dev/null | grep ... || true` cannot: a
          # broken kind/docker yields empty stdout, grep matches nothing,
          # and `|| true` swallows the failure, so the check reports "no
          # leaks" and passes. That makes this guard incapable of failing
          # in exactly the situation it exists to police. Same defect and
          # same fix as `scripts/verify-cleanup.sh`'s `fetch_clusters`.
          clusters=""
          status=0
          clusters="$(kind get clusters 2>&1)" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::kind get clusters failed (exit $status): $clusters"
            exit 1
          fi
          leaked="$(printf '%s\n' "$clusters" | grep '^adlab-' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::leaked adlab-* cluster(s) after ${{ matrix.package }}::${{ matrix.test }}:"
            echo "$leaked"
            echo "$leaked" | xargs -r -n1 kind delete cluster --name
            exit 1
          fi
          echo "no adlab-* cluster left behind"

  action:
    # ROADMAP Task 5.4 step 5: the composite action, run against this
    # repository's own example, on every pull request that touches either.
    #
    # It is a separate job rather than another `matrix.include` entry
    # above for the same reason those entries are separate jobs from each
    # other -- it creates its own clusters and must not serialize behind
    # anyone else's -- and because it shares none of that job's steps: it
    # installs no `kind` of its own (proving that the action does), runs
    # no `cargo test` (the action builds and runs the binary), and its
    # assertions are about files on disk rather than about a test binary's
    # exit code.
    #
    # What this job can prove, and what it cannot: it exercises the
    # action's real steps -- the from-source build, the pinned checksummed
    # `kind` install, the tool verification, the run, the summary, the
    # artifact upload, and the exit-code propagation -- against a real
    # two-cluster lab. What it cannot exercise is the pinned-release
    # download branch, which needs a published release to download; that
    # branch is covered by `docs/github-action.md`'s instructions and by
    # the first workflow that uses it, and it is deliberately built so
    # that failing to verify a checksum stops the run rather than falling
    # back to anything.
    name: GitHub composite action (examples/admission-basic)
    runs-on: ubuntu-latest
    # Two bare `kind` clusters, four dry-run admission requests, and one
    # `cargo build --release` -- the build dominates, and dominates most
    # on the first run after a dependency change, when the cache below
    # cannot help. 30 minutes matches the matrix job above rather than
    # inventing a second ceiling.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        # Same pin as every other workflow in this repository.
        uses: actions/checkout@v7.0.1

      - name: Cache Cargo registry, git deps, and target directory
        uses: Swatinem/rust-cache@v2.9.2
        with:
          # Its own cache entry, for the same reason the matrix jobs each
          # take one: this job builds a *release* profile, which shares
          # almost nothing with the debug artifacts the test jobs cache.
          key: composite-action

      - name: Verify Docker is reachable
        run: docker version

      # The action under test. Deliberately referenced by path with no
      # `version` input, which selects its from-source branch: the whole
      # point of this job is to test the action *in this pull request*,
      # and a pinned release download would test a previously published
      # binary instead.
      #
      # No `continue-on-error` here either: `examples/admission-basic` is
      # designed to pass, so the action failing means either the example
      # regressed or the wrapper did, and both should fail this job.
      - name: Run the Admission Lab action
        id: lab
        uses: ./.github/actions/admissionlab
        with:
          config: examples/admission-basic/admissionlab.yaml
          # Also names the report directory under the workspace, as of
          # Task 7.6: `report-dir` is no longer an input, so the two can
          # no longer disagree. The absolute path comes back out as the
          # `report-dir` output, which the next step reads.
          artifact-name: admissionlab-basic-artifacts

      - name: Assert the action produced every artifact
        # `always()` so a failing lab still gets its artifacts checked --
        # ROADMAP step 4 is precisely the claim that they exist even then,
        # and a step that only ran on success could never observe it.
        if: always()
        # Existence only. This job does not read `result.json`'s contents
        # any more than the action does: what a run *meant* is the
        # binary's business, and a workflow that asserted on a verdict
        # here would be the second engine the exit gate forbids. The
        # verdict is already checked -- by the action's final step, which
        # made this job's own conclusion Admission Lab's exit code.
        env:
          REPORT_DIR: ${{ steps.lab.outputs.report-dir }}
        run: |
          set -euo pipefail
          # The output, with the action's own documented derivation
          # (`$GITHUB_WORKSPACE/<artifact-name>`) as the fallback: a
          # composite action that failed early may not have published its
          # outputs, and this step runs `if: always()` precisely so it can
          # look at that case.
          dir="${REPORT_DIR:-${GITHUB_WORKSPACE}/admissionlab-basic-artifacts}"
          echo "checking ${dir}"
          missing=""
          for artifact in result.json report.html github-summary.md; do
            [ -s "${dir}/${artifact}" ] || missing="${missing} ${artifact}"
          done
          # The run manifest is collected out of the run workspace by the
          # action, named by run id, so it is matched rather than named.
          manifests="$(find "${dir}/run-manifests" -name '*.json' -type f 2>/dev/null | wc -l)"
          [ "${manifests}" -ge 1 ] || missing="${missing} run-manifests/<run-id>.json"
          if [ -n "${missing}" ]; then
            echo "::error::the action did not produce:${missing}"
            find "${dir}" -type f | sort
            exit 1
          fi
          find "${dir}" -type f | sort

      - name: Verify no adlab-* cluster was left behind
        if: always()
        # The same guard, and the same reasoning, as the matrix job's:
        # PRODUCT.md §33's "no leaked cluster after normal failure paths"
        # applies to a run driven through the action exactly as it applies
        # to one driven through `cargo test`.
        run: |
          set -euo pipefail
          clusters=""
          status=0
          clusters="$(kind get clusters 2>&1)" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::kind get clusters failed (exit $status): $clusters"
            exit 1
          fi
          leaked="$(printf '%s\n' "$clusters" | grep '^adlab-' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::leaked adlab-* cluster(s) after the composite action job:"
            echo "$leaked"
            echo "$leaked" | xargs -r -n1 kind delete cluster --name
            exit 1
          fi
          echo "no adlab-* cluster left behind"

  action-failure:
    # ROADMAP Task 7.6 step 4: "verify exit 1 marks the job failed while
    # artifacts still upload using `if: always()`". The `action` job above
    # runs a lab that is designed to *pass*, so it can only ever observe
    # half of that sentence. This job observes the other half, which is
    # the half the artifacts exist for.
    #
    # The lab is `examples/kyverno-istio-upgrade`, this repository's
    # canonical demonstration of a real regression: it installs Kyverno
    # 3.9.0 + Istio 1.30.4 on the baseline side and the candidate versions
    # on the other, finds unexpected critical differences, and exits 1.
    # Nothing about it is rigged for this job -- it is the same file
    # `alpha_e2e` drives and the same one the README walks through -- which
    # is what makes it evidence rather than a mock.
    #
    # `continue-on-error` at the *workflow* step level is what lets the
    # assertions run after the action fails. It is a workflow key, not a
    # composite-action one (see the action's own header for why the action
    # cannot use it internally), so it works normally here: the step's
    # `outcome` records `failure` while its `conclusion` becomes `success`
    # and the job continues. Asserting on `outcome` is therefore a direct
    # assertion that a downstream repository's job WOULD have failed.
    #
    # What this job still cannot prove, and what remains an operator item
    # before the Beta ships: that the artifacts are *retrievable from the
    # GitHub API* on a failed job, and that the job summary renders on a
    # real pull request. Both need a real run of a real pull request; this
    # job proves the action's own behavior -- exit code, files on disk,
    # summary content -- which is everything the action itself decides.
    name: GitHub composite action, failing lab (examples/kyverno-istio-upgrade)
    runs-on: ubuntu-latest
    # Larger than the `action` job's 30: this lab installs a real Kyverno
    # and a real Istio on each of two clusters, and `alpha_e2e` -- the
    # same lab, driven through the same binary -- is measured at 89.7 s
    # per run on the reference machine with a warm image cache, dominated
    # by container image pulls that a cold hosted runner does not have.
    # 45 minutes leaves room for that plus one `cargo build --release`.
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Cache Cargo registry, git deps, and target directory
        uses: Swatinem/rust-cache@v2.9.2
        with:
          # Its own entry rather than sharing `composite-action`: two jobs
          # writing one key means only the first one's save is kept, so
          # sharing would silently halve the cache's value for both.
          key: composite-action-failure

      - name: Verify Docker is reachable
        run: docker version

      - name: Run the Admission Lab action against a failing lab
        id: lab
        continue-on-error: true
        uses: ./.github/actions/admissionlab
        with:
          config: examples/kyverno-istio-upgrade/admissionlab.yaml
          artifact-name: admissionlab-failing-artifacts

      - name: Assert the failing lab failed the step and still uploaded its evidence
        # Not `if: always()`: this step IS the assertion, and a job in
        # which it did not run has proven nothing.
        env:
          OUTCOME: ${{ steps.lab.outcome }}
          EXIT_CODE: ${{ steps.lab.outputs.exit-code }}
          REPORT_DIR: ${{ steps.lab.outputs.report-dir }}
        run: |
          set -euo pipefail

          # Half one: the step failed. Without `continue-on-error` above,
          # this is the moment the job would have ended -- which is
          # exactly the downstream behavior being asserted.
          if [ "${OUTCOME}" != "failure" ]; then
            echo "::error::the action's step outcome was '${OUTCOME}', not 'failure'; a failing lab must fail the job"
            exit 1
          fi

          # And it failed for the documented reason. `1` is the policy
          # verdict; 2-6 would mean the lab never reached one, which is a
          # different (and, here, broken) thing. This reads the action's
          # own output, not `result.json`: what the run MEANT is the
          # binary's business, and a workflow that re-derived a verdict
          # here would be the second engine the Phase 5 exit gate forbids.
          if [ "${EXIT_CODE}" != "1" ]; then
            echo "::error::expected exit code 1 (policy failure) from examples/kyverno-istio-upgrade, got '${EXIT_CODE}'"
            exit 1
          fi

          # Half two: the artifacts exist anyway. This is what
          # `if: always()` on the action's summary/collect/upload steps
          # buys, and the only way to observe it is on a run that failed.
          dir="${REPORT_DIR:-${GITHUB_WORKSPACE}/admissionlab-failing-artifacts}"
          echo "checking ${dir}"
          missing=""
          for artifact in result.json report.html github-summary.md; do
            [ -s "${dir}/${artifact}" ] || missing="${missing} ${artifact}"
          done
          manifests="$(find "${dir}/run-manifests" -name '*.json' -type f 2>/dev/null | wc -l)"
          [ "${manifests}" -ge 1 ] || missing="${missing} run-manifests/<run-id>.json"
          if [ -n "${missing}" ]; then
            echo "::error::a failing run did not produce:${missing} -- the artifacts a reviewer needs are missing from exactly the case they exist for"
            find "${dir}" -type f 2>/dev/null | sort
            exit 1
          fi
          find "${dir}" -type f | sort

          # The summary the action appended to $GITHUB_STEP_SUMMARY is
          # this file, rendered by the binary. A failing run's summary
          # must actually say so -- an artifact that exists but claims
          # PASS would be worse than a missing one.
          if ! grep -qF 'Admission Lab: FAIL' "${dir}/github-summary.md"; then
            echo "::error::github-summary.md does not carry the FAIL verdict:"
            cat "${dir}/github-summary.md"
            exit 1
          fi

      - name: Verify no adlab-* cluster was left behind
        if: always()
        # PRODUCT.md §33's "no leaked cluster after normal failure paths"
        # -- and this job is the one that actually exercises a failure
        # path end to end, so the guard matters more here than anywhere
        # else in this file.
        run: |
          set -euo pipefail
          clusters=""
          status=0
          clusters="$(kind get clusters 2>&1)" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::kind get clusters failed (exit $status): $clusters"
            exit 1
          fi
          leaked="$(printf '%s\n' "$clusters" | grep '^adlab-' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::leaked adlab-* cluster(s) after the failing-lab action job:"
            echo "$leaked"
            echo "$leaked" | xargs -r -n1 kind delete cluster --name
            exit 1
          fi
          echo "no adlab-* cluster left behind"
