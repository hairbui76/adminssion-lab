name: Integration

on:
  pull_request:
    paths:
      - "crates/admissionlab-cluster/**"
      - "crates/admissionlab-installer/**"
      - "crates/admissionlab-admission/**"
      - "crates/admissionlab-gateway/**"
      - "recipes/**"
      - "fixtures/**"
      - "testdata/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Real kind/Docker integration smoke test
    runs-on: ubuntu-latest
    # Generous headroom: Task 1.9 measured ~105s for a single `kind
    # create cluster` on a cold node-image pull (see
    # crates/admissionlab-cluster/src/kind.rs's `CREATE_TIMEOUT` comment),
    # and this job creates two concurrently, on a runner that has never
    # pulled the node image before, on top of checkout/dependency-build
    # time on a cold cache.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # v7.0.1: verified against the GitHub API
        # (api.github.com/repos/actions/checkout/releases/latest) on
        # 2026-08-30. Same pin already used by .github/workflows/ci.yml.
        uses: actions/checkout@v7.0.1

      - name: Cache Cargo registry, git deps, and target directory
        # v2.9.2: verified against the GitHub API
        # (api.github.com/repos/Swatinem/rust-cache/releases/latest) on
        # 2026-08-30. Same pin already used by .github/workflows/ci.yml.
        uses: Swatinem/rust-cache@v2.9.2

      - name: Verify Docker is reachable
        # No install step: GitHub-hosted `ubuntu-latest` runners ship
        # Docker Engine preinstalled and already running (confirmed
        # present in the runner image's own software inventory at Docker
        # Client/Server 28.0.4 as of this writing). This check exists so
        # a future runner-image change that drops Docker fails here, with
        # a clear message, rather than deep inside `kind create cluster`.
        run: docker version

      - name: Install kind v0.33.0
        # Pinned to the exact `kind` version this project has actually
        # validated its cluster lifecycle against (the same version whose
        # release the node-image digests in compatibility/kubernetes.yaml
        # were captured from), rather than trusting whichever `kind`
        # version a given runner image happens to ship (observed as
        # v0.32.0 in the runner image's inventory at the time this
        # workflow was written) -- CI tooling should be pinned as
        # deliberately as the Kubernetes node images themselves.
        # Downloaded directly from the upstream GitHub release and
        # checksummed against kind's own published
        # `kind-linux-amd64.sha256sum` for that release, rather than
        # adding and pinning a third-party GitHub Action just to fetch
        # one binary.
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64"
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  /tmp/kind" | sha256sum -c -
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: Print kubectl version
        # Already present on the runner image (observed at v1.36.4,
        # matching this project's own Tier 1 primary supported version in
        # compatibility/kubernetes.yaml) -- printed here for diagnostics,
        # not installed.
        run: kubectl version --client=true

      - name: Run the real kind integration smoke test
        run: cargo test -p admissionlab-cluster --test kind_smoke -- --ignored --nocapture

      - name: Verify no adlab-* cluster was left behind
        if: always()
        # PRODUCT.md §33: "no leaked cluster after normal failure paths".
        # This runner VM is discarded after the job regardless, but this
        # step still catches a real cleanup regression while it is easy
        # to diagnose, and best-effort deletes anything found rather than
        # leaving it running for the rest of this job's lifetime.
        run: |
          set -euo pipefail
          leaked="$(kind get clusters 2>/dev/null | grep '^adlab-' || true)"
          if [ -n "$leaked" ]; then
            echo "::error::leaked adlab-* cluster(s) after kind_smoke:"
            echo "$leaked"
            echo "$leaked" | xargs -r -n1 kind delete cluster --name
            exit 1
          fi
          echo "no adlab-* cluster left behind"
