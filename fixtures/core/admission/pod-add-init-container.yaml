# Init-container mutation, half 1 of 2: adding one to a pod that has no
# `spec.initContainers` array at all.
#
# The absent-array case is the common one for a real pod, and
# `crates/admissionlab-test-webhook/src/mutate.rs` handles it differently
# from an append: RFC 6902 has no valid `add <pointer>/-` for a pointer
# that does not exist, so the webhook emits
#
# ```json
# [{"op": "add", "path": "/spec/initContainers", "value": [{"name": "setup", "image": "..."}]}]
# ```
#
# -- creating the array. `pod-remove-init-container.yaml` covers the
# other half (a present array, indexed removal), so the corpus exercises
# both shapes of init-container patch rather than assuming one implies
# the other.
#
# Carries the `test.admissionlab.io/containers` gate label for the same
# reason `pod-add-container.yaml` does: init containers are a
# `MutationScope::Workload` action, and that configuration's
# `objectSelector` requires the label.
apiVersion: v1
kind: Pod
metadata:
  name: add-init-container
  namespace: admissionlab-fixtures
  labels:
    test.admissionlab.io/containers: "enabled"
  annotations:
    test.admissionlab.io/add-init-container: "setup=registry.k8s.io/pause:3.10"
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
