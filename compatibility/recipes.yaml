# Which recipe x Kubernetes version combinations Admission Lab certifies,
# and why -- a different question from `compatibility/kubernetes.yaml`
# (which Kubernetes versions Admission Lab itself provisions at all;
# 1.35.8 / 1.36.4 (primary) / 1.37.0 as of this writing). Controller
# Ruling R28 (Task 2.5): a recipe's own documented Kubernetes support can
# be -- and, for at least one Alpha recipe below, is -- narrower than
# that overall matrix. This file exists to make that distinction
# expressible, not to assume every recipe automatically covers whatever
# Admission Lab itself supports.
#
# This file's Rust loader is `admissionlab_recipes::compat`
# (`crates/admissionlab-recipes/src/compat.rs`), which embeds these bytes
# at compile time and is validated by
# `crates/admissionlab-recipes/tests/compatibility.rs` -- so a bad
# hand-edit here fails CI immediately rather than silently drifting
# unnoticed. Its real consumers today are the recipe certification tests
# (which derive from `certified` below which Kubernetes version(s) to
# install against), `admissionlab test` itself (which warns, and never
# refuses, when a lab asks for a combination no row below certifies --
# Task 7.4 step 3), and `scripts/recipe-matrix.py`, which turns the rows
# below into the CI job matrix `.github/workflows/recipe-matrix.yml`
# runs. A row nothing consumes is not a certification.
#
# Shape, per entry under `recipes:`:
#
#   - name: the recipe's name (matches `Recipe::name`).
#     version: the recipe's own pinned version (matches `Recipe::version`).
#     kubernetes:
#       documentedRange: the Kubernetes minor-version window the
#         vendor's OWN documentation states for this recipe version, at
#         exactly the granularity the vendor states it (a minor, not a
#         fabricated patch-level claim the vendor never made). A chart's
#         `Chart.yaml` `kubeVersion` field is deliberately NOT used for
#         this by itself: an open lower bound with no upper bound (for
#         example `>=1.25.0-0`) is Helm's own install-time gate, not a
#         compatibility guarantee -- Helm will happily install a chart
#         on a Kubernetes version its own maintainers never tested
#         against. An absent or unbounded constraint means "unknown,"
#         never "supported" (Global Constraint 15: missing data is
#         unavailable/unknown, never fabricated). Explicitly `null`
#         (never silently omitted) when no vendor statement was found at
#         all, so a reader can tell "no vendor statement exists" apart
#         from "someone forgot to fill this in."
#       certified: the exact set of Kubernetes PATCH versions -- always
#         a subset of `compatibility/kubernetes.yaml`'s own
#         `supported: true` entries -- that this recipe version is
#         certified against, each with the CI tier that proves it (see
#         "Tiers" below). Computed by intersecting `documentedRange`
#         (when present) with Admission Lab's own supported matrix, then
#         hand-reviewed and checked in here exactly like
#         `compatibility/kubernetes.yaml` itself is (a deliberate,
#         reviewed change to this file, never derived at runtime).
#
#         Each element is a mapping, not a bare string:
#
#           - version: "1.35.8"
#             tier: perCommit
#
#         Task 2.5 wrote this list as bare strings, when it was a
#         DECLARED target for a certification task not yet written and
#         no CI job read it. Task 7.4 gives every element the tier that
#         actually runs it, because a certification nobody schedules is
#         a claim rather than evidence -- and because
#         `.github/workflows/recipe-matrix.yml`'s job matrix is
#         generated from exactly these rows rather than from a
#         hardcoded array that could disagree with them.
#
# Tiers (PRODUCT.md §32; ROADMAP Task 7.5). `tier` records the MOST
# FREQUENT schedule that runs a combination; every tier additionally
# runs every more frequent tier's rows, so the sets are cumulative
# downward and each row appears exactly once, at its cheapest schedule:
#
#   perCommit     Tier 1. Runs on every pull request that touches the
#                 code or metadata it covers. Reserved for one
#                 Kubernetes version per recipe, because a per-commit
#                 job that installs a full Istio on three clusters costs
#                 more than the signal it adds.
#   nightly       Tier 2. `.github/workflows/nightly.yml`. The rest of
#                 the supported minors for the admission recipes, so
#                 every supported minor is exercised by a certified
#                 recipe once a day (the Phase 7 exit gate's "run Tier 2
#                 across all three Kubernetes minors").
#   weeklyRelease Tier 3. Weekly cron plus manual dispatch, and every
#                 release candidate. The expanded Gateway combinations,
#                 run alongside reliability repetition and the Gateway
#                 demos.
#
# A tier is a statement about SCHEDULE, never about confidence: every
# row below has actually been installed and verified by a test in this
# repository (each entry's own comment names which), and a `nightly` row
# is exactly as certified as a `perCommit` one.
#
# Multiple entries may share a `name` over time as a recipe's pinned
# version changes (append a new entry; do not edit an old one in place),
# the same append-don't-mutate discipline
# `compatibility/kubernetes.yaml` uses for a retired Kubernetes minor.
#
# Populated 2026-08-30, researched for Task 2.5 against
# `.superpowers/sdd/ROADMAP/research-kyverno.md` and `research-istio.md`
# (both fetched from upstream chart/doc sources; commands given inline in
# each file), cross-referenced against `compatibility/kubernetes.yaml`
# (same date): supported set 1.35.8 / 1.36.4 (primary) / 1.37.0.
#
# Tiers assigned 2026-09-01 for Task 7.4, from the certification tests
# that already existed rather than from intent -- see each entry.

# The Kubernetes support-window escape hatch (Task 7.4 step 1; Global
# Constraint 10, "support for the latest three upstream-supported
# Kubernetes minor versions at release time").
#
# `admissionlab_recipes::compat::validate_compatibility` requires exactly
# `RELEASE_SUPPORTED_MINORS` (3) `supported: true` minors in
# `compatibility/kubernetes.yaml` for a release candidate. The count is a
# Rust constant, not a field here, precisely so that "we support three
# minors" cannot be edited away in passing -- Global Constraint 10 is a
# product decision, not configuration.
#
# What IS expressible here is the roadmap's own exception: "unless the
# upstream support window temporarily differs and release notes explain
# it." When upstream itself is between windows (a minor reaching EOL
# before its successor is out, say), set:
#
#   supportWindowException:
#     expectedSupportedMinors: 2
#     reason: "<what upstream did, in one sentence>"
#     releaseNotes: "<path or URL to the release notes that explain it>"
#
# All three fields are required when the key is present, and
# `expectedSupportedMinors` must actually differ from 3 (an exception
# that restates the default is stale, and validation says so). Taking
# the exception is therefore a reviewable diff to this checked-in file
# that names its own justification -- never a flag someone passes on a
# release machine, and never something derived from what upstream
# happened to publish that morning.
#
# Absent today: upstream supports 1.35, 1.36 and 1.37, which is exactly
# three.

recipes:
  - name: kyverno
    version: "3.9.0"
    kubernetes:
      # kyverno.io/docs/installation/releases/ (current release line,
      # chart 3.9.0 / appVersion v1.19.0, fetched 2026-08-30):
      # "Kubernetes Versions Supported: v1.33 - v1.35." (with the caveat
      # "Other Kubernetes versions may work, but are not tested and
      # therefore no guarantees are made as to their full
      # compatibility.") Chart.yaml itself declares
      # `kubeVersion: '>=1.25.0-0'` -- open lower bound, no upper bound
      # -- which per this file's header comment is not itself a
      # compatibility guarantee.
      documentedRange:
        min: "1.33"
        max: "1.35"
      # Only 1.35.8 falls inside documentedRange. Admission Lab's own
      # Tier-1 primary, 1.36.4, does NOT -- deliberately excluded, not
      # an oversight: this is the exact divergence this file exists to
      # make expressible (research-kyverno.md §1.1: "neither chart's
      # upstream-tested range reaches 1.36 (Admission Lab's primary) or
      # 1.37").
      #
      # perCommit: ROADMAP Task 7.5 puts "current Kyverno" in Tier 1,
      # and `crates/admissionlab-recipes/tests/kyverno_recipe.rs`
      # already runs on every pull request that touches this crate
      # (`.github/workflows/integration.yml`), measured at 113.97 s.
      # Kyverno's single certified version is 1.35.8 rather than the
      # Tier-1 primary 1.36.4 for the reason directly above: a Tier-1
      # job on 1.36.4 would be an uncertified combination, which is the
      # one thing a certification job must not be.
      certified:
        - version: "1.35.8"
          tier: perCommit
  - name: istio
    version: "1.30.4"
    kubernetes:
      # Neither `istio/base` nor `istio/istiod` 1.30.4 declares a
      # `kubeVersion` constraint in Chart.yaml (research-istio.md,
      # opening summary), and no "Kubernetes versions supported"
      # statement from Istio's own docs was found during that research
      # session (unlike Kyverno's docs, which state one explicitly).
      # Explicitly null rather than silently omitted -- see this file's
      # header comment.
      documentedRange: null
      # With no documented constraint narrowing it, `certified` is the
      # full Admission Lab supported set, including the Tier-1 primary
      # -- unlike Kyverno's above. Every version listed here is actually
      # installed and sidecar-injection-verified, in its own disposable
      # cluster, by
      # `crates/admissionlab-recipes/tests/istio_recipe.rs`
      # (`istio_recipe_installs_and_injects_sidecar_for_every_certified_kubernetes_version`);
      # all three iterations together measured 222.00 s.
      #
      # 1.36.4 is perCommit because it is Admission Lab's Tier-1 primary
      # and ROADMAP Task 7.5 puts "current Istio" in Tier 1. The other
      # two are nightly: running all three per commit triples the
      # heaviest recipe job for a signal that a nightly catches within
      # the day, and Tier 2's own purpose is exactly "latest 3 K8s
      # minors x selected recipe versions". Between this entry's three
      # rows and Kyverno's one, Tier 2 covers every supported minor --
      # the Phase 7 exit gate's "run Tier 2 across all three Kubernetes
      # minors".
      certified:
        - version: "1.35.8"
          tier: nightly
        - version: "1.36.4"
          tier: perCommit
        - version: "1.37.0"
          tier: nightly
  # Task 6.10. `recipes/istio-gateway/` is a TWO-component stack -- the
  # vendored Gateway API CRD bundle (`gateway-api-crds.yaml`, Gateway API
  # v1.5.1) followed by `istiod` (`recipe.yaml`) -- and this single entry
  # certifies the pair. There is deliberately no separate
  # `gateway-api-crds` entry: that component installs
  # CustomResourceDefinitions and nothing else, is never installed alone,
  # and has no behavior of its own to certify against a Kubernetes
  # version independently of the implementation that serves the API it
  # adds. `crates/admissionlab-recipes/tests/istio_gateway_recipe.rs`
  # reads the `certified` list below at test time and installs BOTH
  # components once per listed version, in that version's own disposable
  # cluster.
  #
  # Same `version` as the `istio` entry above and for the same reason it
  # is a chart version: both recipes install `istio/istiod` 1.30.4, and
  # that shared pin is machine-checked (see
  # `recipes/istio-gateway/recipe.yaml`'s own "Chart pin" note). The
  # Gateway API bundle version this recipe additionally pins (v1.5.1) is
  # carried by `gateway-api-crds.yaml`'s own `version` field, not here:
  # this file's shape has one `version` per entry, and the entry is named
  # for the component that carries the capability.
  - name: istio-gateway
    version: "1.30.4"
    kubernetes:
      # Two upstreams, neither of which states a Kubernetes support
      # range for what this recipe installs:
      #
      #   - Istio: exactly as the `istio` entry above records -- no
      #     `kubeVersion` in `Chart.yaml`, no vendor support statement
      #     found.
      #   - Gateway API v1.5.1: its own release notes state no supported
      #     Kubernetes range at all (checked directly against the GitHub
      #     release for that tag while writing this entry). The nearest
      #     thing to a version statement anywhere in the v1.5 notes is
      #     "TLSRoute's CEL validation requires Kubernetes 1.31 or
      #     higher" -- about one kind this recipe never uses, and a floor
      #     far below every version in Admission Lab's own matrix.
      #
      # Explicitly null rather than silently omitted, and not
      # manufactured out of the TLSRoute floor: an absent constraint
      # means "unknown," never "supported" (Global Constraint 15).
      documentedRange: null
      # The full Admission Lab supported set, matching the `istio` entry.
      # Every version listed here has actually been installed and
      # traffic-tested end to end by `tests/istio_gateway_recipe.rs`
      # (Gateway + HTTPRoute reconciled to
      # Accepted/ResolvedRefs/Programmed, then a real HTTP 200 from the
      # expected echo backend, in both the same-namespace and the
      # cross-namespace/`ReferenceGrant` configuration); all three
      # iterations together measured 269.95 s.
      #
      # 1.36.4 is perCommit -- ROADMAP Task 7.5 names "current Istio
      # Gateway" in Tier 1, on the primary Kubernetes version.
      #
      # The other two are weeklyRelease rather than nightly, which is
      # this file's only Tier-3 content and is a deliberate reading of
      # Task 7.5's own Tier 3 line ("expanded supported combinations +
      # reliability repetition + Gateway demos"): the two non-primary
      # minors of the GATEWAY recipe are precisely "expanded Gateway
      # combinations," and they are the most expensive rows here -- each
      # builds the echo backend image, installs the Gateway API CRD
      # bundle and istiod, waits for real status convergence and then
      # sends real traffic. Nightly Tier 2 still covers all three
      # supported minors through the `istio` and `kyverno` entries
      # above, so scheduling these weekly costs no minor's coverage; it
      # only means the Gateway data plane on a non-primary minor is
      # proven weekly instead of daily, which is the trade Tier 3 exists
      # to make.
      certified:
        - version: "1.35.8"
          tier: weeklyRelease
        - version: "1.36.4"
          tier: perCommit
        - version: "1.37.0"
          tier: weeklyRelease
