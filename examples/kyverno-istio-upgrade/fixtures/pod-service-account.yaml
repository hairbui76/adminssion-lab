# Control group, 5 of 5: a pod that runs as a named, non-default
# ServiceAccount.
#
# `service_account_changed` is graded `critical` by default: a stack that
# starts rewriting `spec.serviceAccountName` has silently changed what
# every one of those pods is authorized to do, and that is not something
# a report should mention in passing. Observing it at all requires a
# fixture whose service account is a deliberate, distinguishable value
# rather than the namespace default, which is what this fixture is.
#
# `alpha-audit` is created by `fixtures/core/alpha-corpus/00-setup.yaml`,
# in the same `kubectl apply` as the namespace itself. That is not
# incidental: see that file's own "The ServiceAccounts still have to
# exist" section for why depending on the asynchronously created
# `default` account would make every fixture in this corpus race a
# controller.
apiVersion: v1
kind: Pod
metadata:
  name: alpha-service-account
  namespace: admissionlab-alpha-plain
  labels:
    app.kubernetes.io/part-of: admission-lab
spec:
  serviceAccountName: alpha-audit
  automountServiceAccountToken: false
  containers:
    - name: app
      image: registry.k8s.io/pause:3.8
