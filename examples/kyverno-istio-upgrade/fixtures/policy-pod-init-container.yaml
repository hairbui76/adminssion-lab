# The headline fixture: the pod whose injected init container the
# candidate stack no longer adds.
#
# # What each side does to it
#
# Both sides install the same pinned Kyverno (chart 3.9.0) and both
# install a `ClusterPolicy` named `alpha-image-pin`, which rewrites this
# pod's `app` image. Only the **baseline** additionally installs
# `alpha-audit-init`, the policy whose one rule prepends an
# `alpha-audit-init` init container to every pod in
# `admissionlab-alpha`. The candidate's `alpha-policies` component simply
# does not contain that policy — the exact shape of a real platform
# change, where a policy is retired or renamed during an upgrade and
# nobody notices that something stopped being injected.
#
# So, replaying these same bytes through both stacks:
#
#   - baseline admits a pod with `initContainers: [alpha-audit-init]`
#     and `app` pinned to the baseline image;
#   - candidate admits a pod with **no init containers** and `app`
#     pinned to the candidate image.
#
# `admissionlab_diff::workload` reports the first difference as
# `init_container_removed` with `subject: alpha-audit-init` — graded
# `critical` by `admissionlab_policy::severity`'s frozen table, with no
# expectation covering it, which is what makes the whole run exit `1`.
#
# # Why the image pin also applies here
#
# It would be simpler to leave this pod out of `alpha-image-pin`. It is
# deliberately in: because both sides' Kyverno mutating webhook is then
# invoked for this pod, the two traces contain the *same* webhook at the
# *same* position with two different observed patches, and
# `admissionlab_diff::divergence` can therefore attribute the first
# divergence to that named webhook with `observed` confidence rather than
# reporting `unknown`. A regression that says "here is where it happened"
# is worth more than one that says "something changed"; this is what buys
# that.
#
# # Why this pod declares no init containers of its own
#
# So that `object_path` for the removal is unambiguous. Strategic-merge
# insertion position for a list with a merge key is a Kyverno/Kubernetes
# implementation detail, and a fixture that already carried its own init
# container would make the reported index depend on it.
# `pod-existing-init.yaml` covers the "the fixture brought its own"
# shape instead, in a namespace no policy touches.
apiVersion: v1
kind: Pod
metadata:
  name: alpha-init-target
  namespace: admissionlab-alpha
  labels:
    app.kubernetes.io/part-of: admission-lab
spec:
  serviceAccountName: alpha-runner
  automountServiceAccountToken: false
  containers:
    - name: app
      image: registry.k8s.io/pause:3.8
