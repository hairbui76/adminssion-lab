# The behavior changes this upgrade was *meant* to produce.
#
# Read alongside `admissionlab.yaml`. Two of the three differences a run
# of this lab reports are accounted for here; the third — the
# `init_container_removed` on
# `fixtures/policy-pod-init-container.yaml` — deliberately is not, and
# is what makes the run fail.
#
# # What an entry does, and what it does not do
#
# Marking a change expected does not change its severity and does not
# remove it from the report. `admissionlab_policy::ClassifiedChange`
# keeps the change verbatim, keeps the grade policy gave it, and sets
# `expected: true` — the run's disposition is then decided by the
# *unexpected* changes alone. So an expected `critical` still prints as
# critical, still appears in `result.json` with `"severity": "critical"`,
# and simply stops being a reason to exit non-zero. That is the whole
# difference between "we know about this" and "hide this".
#
# # Why an unmatched entry is not silently fine
#
# An expectation that matches nothing in a run is reported as a
# `stale_expectation` in `result.json`. It does not change the verdict —
# a tidy-your-config problem is not a statement about the two stacks, and
# folding it in would make `warn` mean two unrelated things — but it is
# visible, which is what stops this file from accumulating entries that
# stopped applying releases ago.
apiVersion: admissionlab.io/v1alpha1
kind: Expectations
expectations:
  # 1. The image bump the upgrade is actually for.
  #
  # `admissionlab.yaml`'s `policy.failOn` escalates `image_changed` to
  # `critical`, so without this entry the run would fail on three
  # fixtures that changed exactly as intended, and the one finding that
  # matters would be a quarter of the output instead of all of it. This
  # entry is what buys that signal-to-noise, and removing it is the
  # cheapest way to confirm it is doing so.
  #
  # Scoped by fixture glob and by subject: `fixtures-policy-*` is the
  # three fixtures in `admissionlab-alpha` (the Kyverno policy target
  # namespace — the corpus's control-group fixtures are named
  # `fixtures-pod-*` and are outside it), and `app` is the one container
  # `alpha-image-pin` names. A second container in the same pod whose
  # image changed would still fail this run, which is the point of
  # naming the subject rather than accepting any image change on those
  # fixtures.
  - id: alpha-pinned-image-bump
    fixtures: "fixtures-policy-*"
    kind: image_changed
    selector:
      subject: app
    reason: >-
      The `alpha-image-pin` ClusterPolicy pins the `app` container image
      for every workload in the admissionlab-alpha namespace, and the
      candidate stack pins registry.k8s.io/pause:3.10 where the baseline
      pins :3.9. This is the change the upgrade is for; it was reviewed
      when `stacks/candidate/policies.yaml` was written.

  # 2. The same change, observed one layer down, on the two controller
  #    fixtures.
  #
  # Kyverno answers with one JSON patch per request, so a rule that
  # pins a different image emits a different patch — and
  # `admissionlab_diff::trace` reports a webhook whose two observed
  # patches differ as `webhook_invocation_changed` (a `warning`). On
  # `fixtures-policy-deployment-*` and `fixtures-policy-job-*` the image
  # pin is the *only* rule that matched, so the patch difference is
  # exactly the image difference entry 1 already accounts for, seen from
  # the trace instead of from the admitted object.
  #
  # Two narrowly scoped entries rather than one `fixtures-policy-*`
  # entry, and the distinction is the whole reason this file is worth
  # reading: on `fixtures-policy-pod-init-container-*` the Kyverno patch
  # *also* differs, but there it differs for a second, unaccounted
  # reason — the missing init container — and a broader glob would have
  # marked that trace-level evidence expected too. It would not have
  # hidden the regression (the `init_container_removed` on the admitted
  # object is a separate, still-unexpected finding), but it would have
  # quietly excused the one piece of evidence that says which webhook
  # caused it.
  - id: alpha-kyverno-patch-differs-deployment
    fixtures: "fixtures-policy-deployment-*"
    kind: webhook_invocation_changed
    reason: >-
      Kyverno's mutating webhook patches this Deployment's pod template
      on both sides and the two patches differ only in the pinned `app`
      image — the trace-level view of `alpha-pinned-image-bump`.

  - id: alpha-kyverno-patch-differs-job
    fixtures: "fixtures-policy-job-*"
    kind: webhook_invocation_changed
    reason: >-
      Kyverno's mutating webhook patches this Job's pod template on both
      sides and the two patches differ only in the pinned `app` image —
      the trace-level view of `alpha-pinned-image-bump`.
