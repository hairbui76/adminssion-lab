# The behavior changes this upgrade was *meant* to produce.
#
# Read alongside `admissionlab.yaml`. Every difference a run of this lab
# reports on the three `fixtures/policy-*.yaml` fixtures is accounted for
# here; the two on `fixtures/regression-pod-init-container.yaml`
# deliberately are not, and are what make the run fail.
#
# # What an entry does, and what it does not do
#
# Marking a change expected does not change its severity and does not
# remove it from the report. `admissionlab_policy::ClassifiedChange`
# keeps the change verbatim, keeps the grade policy gave it, and sets
# `expected: true` — the run's disposition is then decided by the
# *unexpected* changes alone. So an expected `critical` still prints as
# critical, still appears in `result.json` with `"severity": "critical"`,
# and simply stops being a reason to exit non-zero. That is the whole
# difference between "we know about this" and "hide this".
#
# # Why both entries are scoped by the same filename glob
#
# `fixtures-policy-*` matches the three fixtures the `alpha-image-pin`
# ClusterPolicy targets and *cannot* match the regression fixture, whose
# file is named `regression-pod-init-container.yaml` for exactly that
# reason. Scoping on the fixture's own filename rather than on a
# hand-maintained list means the separation survives someone adding a
# fourth image-pin fixture, and means the finding this demo exists to
# produce cannot be marked expected by a glob somebody widened.
#
# # Why an unmatched entry is not silently fine
#
# An expectation that matches nothing in a run is reported as a
# `stale_expectation` in `result.json`. It does not change the verdict —
# a tidy-your-config problem is not a statement about the two stacks, and
# folding it in would make `warn` mean two unrelated things — but it is
# visible, which is what stops this file from accumulating entries that
# stopped applying releases ago. `alpha_e2e` asserts there are none.
#
# # Why this still says v1alpha1 while `admissionlab.yaml` says v1
#
# `Expectations` is a separate document with its own version, and neither
# Phase 7's Beta promotion nor Phase 9's stable freeze promoted anything
# but the `Lab` document. `admissionlab.io/v1alpha1` is the
# version this file's loader
# (`admissionlab_policy::expectation::resolve_expectations`) accepts, and
# the only one -- so this line is correct, not stale, and changing it to
# match the lab file beside it would make the run fail to start. When
# `Expectations` is promoted, `docs/schema-migrations.md` will carry that
# migration exactly as it carries the `Lab` one.
apiVersion: admissionlab.io/v1alpha1
kind: Expectations
expectations:
  # 1. The image bump the upgrade is actually for, as seen in the
  #    admitted object.
  #
  # `admissionlab.yaml`'s `policy.failOn` escalates `image_changed` to
  # `critical`, so without this entry the run would fail on three
  # fixtures that changed exactly as intended, and the one finding that
  # matters would be a quarter of the output instead of all of it. This
  # entry is what buys that signal-to-noise, and deleting it is the
  # cheapest way to confirm it is doing so.
  #
  # `subject: app` is the container `alpha-image-pin` names. A *second*
  # container in one of those fixtures whose image changed would still
  # fail this run, which is the point of naming the subject rather than
  # accepting any image change on those fixtures.
  - id: alpha-pinned-image-bump
    fixtures: "fixtures-policy-*"
    kind: image_changed
    selector:
      subject: app
    reason: >-
      The `alpha-image-pin` ClusterPolicy pins the `app` container image
      for every workload in the admissionlab-alpha namespace, and the
      candidate stack pins registry.k8s.io/pause:3.10 where the baseline
      pins :3.9. This is the change the upgrade is for; it was reviewed
      when `stacks/candidate/policies.yaml` was written.

  # 2. The same change, as seen in the webhook trace.
  #
  # Kyverno answers with one JSON patch per request, so a rule that pins
  # a different image emits a different patch — and
  # `admissionlab_diff::trace` reports a webhook whose two observed
  # patches differ as `webhook_invocation_changed` (a `warning`). On
  # these three fixtures the image pin is the only rule that matches, so
  # that patch difference is exactly the image difference entry 1 already
  # accounts for, seen one layer down.
  #
  # Deliberately *not* widened to cover the regression fixture. Kyverno's
  # invocation differs there too — that is how the run attributes the
  # first divergence to a named webhook with `observed` confidence — and
  # excusing it would quietly excuse the single best piece of evidence
  # the report contains about who caused the regression.
  - id: alpha-kyverno-patch-differs
    fixtures: "fixtures-policy-*"
    kind: webhook_invocation_changed
    reason: >-
      Kyverno's mutating webhook patches these three workloads on both
      sides and the two patches differ only in the pinned `app` image —
      the trace-level view of `alpha-pinned-image-bump`.
