# The baseline side's Kyverno policy set: three `ClusterPolicy` objects.
#
# This file and its candidate counterpart
# (`../candidate/policies.yaml`) are the *only* difference between the
# two stacks this lab compares. Same Kubernetes version, same Kyverno
# chart version, same Istio chart version, same fixtures, same
# namespaces — one policy present here and absent there, and one image
# tag that differs. Everything the run reports has to come from that,
# which is what makes the demo a regression *reproducer* rather than an
# anecdote about two clusters.
#
# The third policy, `alpha-mesh-sidecar`, is byte-identical to the
# candidate's copy on purpose: a corpus in which every policy differs
# could not show that an *unchanged* mutating webhook produces an
# unchanged result, which is most of what a real upgrade consists of.
#
# # Why the reproducer is a first-party policy, not a vendor bug
#
# ROADMAP Task 4.15 Step 2 is explicit: "Do not rely on a vendor bug that
# may disappear from current versions." A lab pinned to a Kyverno or
# Istio release that once mis-injected something would stop
# demonstrating anything the moment that release is yanked or the
# behavior is fixed, and would be indistinguishable from a broken test
# when it did. These three policies are written here, versioned here,
# and behave identically forever; the *stack* differs between the sides
# because this file differs, and for no other reason.
#
# # `pod-policies.kyverno.io/autogen-controllers: none`
#
# On all three, and on the candidate's copies too. Kyverno can
# autogenerate matching rules for pod controllers from a `Pod`-matching
# rule; switching that off and naming `Deployment`/`Job` in a rule of
# their own keeps this file's behavior legible to a reader who does not
# know that feature exists, and keeps the corpus from depending on the
# generated rules' naming and match semantics, which are a
# Kyverno-version detail rather than a contract.
#
# # `background: false`
#
# These policies exist to be observed on the admission path, which is
# the only path Admission Lab replays fixtures through. Leaving
# background processing on would additionally hand them to Kyverno's
# background controller, which mutates and reports on *existing*
# objects — activity this lab never looks at, that has nothing to do
# with what is being compared, and that would run against two clusters
# on two independent schedules.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: alpha-audit-init
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      Injects the platform's audit init container into every pod in the
      admissionlab-alpha namespace. Deliberately absent from the
      candidate stack: its removal is the critical regression this
      example lab exists to demonstrate.
spec:
  background: false
  rules:
    - name: add-audit-init
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - admissionlab-alpha
      mutate:
        # Strategic merge on a list keyed by `name`: the entry is added
        # when no init container of that name is present, and is a no-op
        # when one already is. Idempotent, so a Kyverno reinvocation
        # cannot append a duplicate.
        patchStrategicMerge:
          spec:
            initContainers:
              - name: alpha-audit-init
                image: registry.k8s.io/pause:3.10
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: alpha-image-pin
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      Pins the `app` container image for every workload in the
      admissionlab-alpha namespace. Present on both sides, with a
      different tag on each: this is the example's deliberate, expected
      image change.
spec:
  background: false
  rules:
    # Two rules rather than one `Pod`-matching rule plus autogen — see
    # this file's header. `(name)` is Kyverno's conditional anchor: it
    # selects the list element whose `name` is `app` and leaves every
    # other container alone, rather than replacing the list.
    - name: pin-pod-image
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - admissionlab-alpha
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): app
                image: registry.k8s.io/pause:3.9
    - name: pin-controller-image
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - Job
              namespaces:
                - admissionlab-alpha
      mutate:
        patchStrategicMerge:
          spec:
            template:
              spec:
                containers:
                  - (name): app
                    image: registry.k8s.io/pause:3.9
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: alpha-mesh-sidecar
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      Appends the platform's own telemetry sidecar to every pod in the
      admissionlab-alpha-mesh namespace. Byte-identical on both sides:
      this is the corpus's container-injection case, and it is expected
      to produce no difference at all.
spec:
  background: false
  rules:
    # Deliberately *not* part of `alpha-image-pin` and deliberately not
    # scoped to `admissionlab-alpha`: keeping container injection in its
    # own namespace means the headline regression fixture
    # (`fixtures/policy-pod-init-container.yaml`) carries exactly one
    # injected element, so the finding it produces names exactly one
    # subject.
    - name: add-telemetry-sidecar
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - admissionlab-alpha-mesh
      mutate:
        # An explicit RFC 6902 append rather than the `patchStrategicMerge`
        # every other rule in this file uses, and the reason is measured
        # rather than stylistic.
        #
        # Strategic merge inserts a patch's list entries *first*, so
        # merging a new container into a one-container pod does not
        # append it — it rewrites `containers[0]` into the sidecar field
        # by field and re-adds the original workload at `containers[1]`.
        # That is eight JSON Patch operations, five of them `remove`s
        # that Kyverno emits in Go map order: the same eight operations
        # in a different sequence on each of the two clusters. The
        # admitted pods are identical, but
        # `admissionlab_normalize::trace` deliberately treats JSON Patch
        # operation order as semantics rather than presentation (Task
        # 4.2), so the two patches compare unequal and the fixture
        # reports a `webhook_invocation_changed` warning about nothing.
        # `fixtures/pod-sidecar-injection.yaml`'s own header records the
        # identical problem in `istiod`'s injector, which cannot be
        # avoided the same way because that patch is not ours to write.
        #
        # An append is one operation. One operation has no order to
        # permute, so both sides emit byte-identical patches and the
        # fixture is `identical` — the outcome an unchanged policy on
        # both sides should produce.
        patchesJson6902: |-
          - op: add
            path: /spec/containers/-
            value:
              name: alpha-telemetry
              image: registry.k8s.io/pause:3.10
