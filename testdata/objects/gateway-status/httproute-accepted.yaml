# A fully reconciled `HTTPRoute`, attached to one Gateway listener.
#
# Provenance: Gateway API v1 `HTTPRoute`. `status.parents` is
# `[]RouteParentStatus`, each carrying `parentRef` (a `ParentReference`:
# `group`, `kind`, `namespace`, `name`, `sectionName`, `port`),
# `controllerName` (a `GatewayController`, a domain-prefixed path -- here
# Istio's own `istio.io/gateway-controller`), and its own
# `[]metav1.Condition`. The route condition types `Accepted` and
# `ResolvedRefs` are upstream `RouteConditionType` values, and the
# reasons `Accepted`/`ResolvedRefs` are `RouteReasonAccepted` and
# `RouteReasonResolvedRefs`.
#
# The conditions are written `ResolvedRefs` first, `Accepted` second --
# the reverse of the order they are usually printed in. Nothing in this
# project may depend on that order (ROADMAP Task 6.3 Step 1), and this
# fixture is what proves it does not.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-a
  namespace: gateway-lab
  generation: 1
spec:
  parentRefs:
    - name: lab-gateway
      sectionName: http
  hostnames:
    - a.lab.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo-a
          port: 80
status:
  parents:
    - parentRef:
        group: gateway.networking.k8s.io
        kind: Gateway
        namespace: gateway-lab
        name: lab-gateway
        sectionName: http
      controllerName: istio.io/gateway-controller
      conditions:
        - type: ResolvedRefs
          status: "True"
          reason: ResolvedRefs
          lastTransitionTime: "2026-09-01T10:16:12Z"
          observedGeneration: 1
        - type: Accepted
          status: "True"
          reason: Accepted
          message: Route was valid
          lastTransitionTime: "2026-09-01T10:16:12Z"
          observedGeneration: 1
