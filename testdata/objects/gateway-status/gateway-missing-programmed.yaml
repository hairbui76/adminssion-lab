# A `Gateway` whose status carries `Accepted` but no `Programmed`
# condition at all.
#
# Provenance: `status.conditions` is a list, and Gateway API does not
# require every condition type to be present at every moment -- a
# controller publishes `Accepted` first and adds `Programmed` when it has
# something to say about it. The absent condition is what
# `ConditionState::Missing` exists for: it is not `False` (nobody said
# no) and not `Unknown` (nobody said "I cannot tell"), and Global
# Constraint 15 forbids collapsing it into either.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: gateway-lab
  generation: 1
spec:
  gatewayClassName: istio
status:
  conditions:
    - type: Accepted
      status: "True"
      reason: Accepted
      lastTransitionTime: "2026-09-01T10:16:09Z"
      observedGeneration: 1
