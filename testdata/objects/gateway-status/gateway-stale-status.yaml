# A `Gateway` whose spec has been edited three times but whose status
# still describes generation 2.
#
# Provenance: `metadata.generation` is incremented by the API server on
# every spec change, and `metav1.Condition.observedGeneration` is
# "the .metadata.generation that the condition was set based upon" --
# both upstream Kubernetes semantics, not Gateway-API-specific. Gateway
# API relies on exactly this to tell a caller whether a status is about
# the object as it is now.
#
# Every condition here is `True`. That is the trap this fixture exists
# for: a reader that only looked at `status` would call this Gateway
# fully programmed, when in fact the controller has not yet seen the
# current spec at all.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: gateway-lab
  generation: 3
spec:
  gatewayClassName: istio
status:
  conditions:
    - type: Accepted
      status: "True"
      reason: Accepted
      lastTransitionTime: "2026-09-01T10:16:09Z"
      observedGeneration: 2
    - type: Programmed
      status: "True"
      reason: Programmed
      lastTransitionTime: "2026-09-01T10:16:11Z"
      observedGeneration: 2
